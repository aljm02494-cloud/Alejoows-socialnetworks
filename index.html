<html lang="es">
<head>

<style>
/* ============================================================
   ALEJOOWS — iOS 26 LIQUID GLASS × NOCTURNAL EMO EDITION
   ============================================================ */
:root {
  --bg-void: #020204;

  --label-primary: #F5F5F8;
  --label-secondary: rgba(235, 235, 245, 0.62);
  --label-tertiary: rgba(235, 235, 245, 0.36);

  --emo-crimson: #FF2D55;
  --emo-oxblood: #9E1937;
  --emo-indigo: #5E5CE6;
  --apple-green: #30D158;
  --apple-blue: #0A84FF;

  --radius-xl: 30px;
  --radius-lg: 22px;
  --radius-md: 16px;

  --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

*, *::before, *::after {
  box-sizing: border-box;
}

html {
  height: 100%;
  background: var(--bg-void);
  color-scheme: dark;
}

body {
  margin: 0;
  min-height: 100dvh;
  padding: clamp(24px, 5vh, 52px) clamp(16px, 4vw, 32px) clamp(24px, 4vh, 36px);
  background: var(--bg-void);
  color: var(--label-primary);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

img, svg {
  display: block;
}

::selection {
  background: rgba(255, 45, 85, 0.38);
  color: #FFFFFF;
}

/* ---------- NOCTURNAL EMO AMBIENT BACKDROP ---------- */
.cosmos {
  position: fixed;
  inset: 0;
  z-index: -2;
  overflow: hidden;
  pointer-events: none;
  background:
    radial-gradient(120% 80% at 50% 0%, #09070D 0%, #020204 62%, #000000 100%);
}

.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(95px);
  opacity: 0.55;
  will-change: transform;
}

.orb-1 {
  width: 560px;
  height: 560px;
  top: -180px;
  left: -120px;
  background: radial-gradient(circle, rgba(168, 22, 56, 0.32), rgba(95, 14, 38, 0.08) 65%, transparent 75%);
  animation: driftA 24s ease-in-out infinite alternate;
}

.orb-2 {
  width: 540px;
  height: 540px;
  bottom: -160px;
  right: -120px;
  background: radial-gradient(circle, rgba(84, 72, 195, 0.24), rgba(38, 30, 90, 0.08) 65%, transparent 75%);
  animation: driftB 28s ease-in-out infinite alternate;
}

.orb-3 {
  width: 380px;
  height: 380px;
  top: 42%;
  left: 48%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(190, 200, 230, 0.075), transparent 72%);
  animation: driftC 20s ease-in-out infinite alternate;
}

@keyframes driftA {
  from { transform: translate(0, 0) scale(1); }
  to { transform: translate(45px, 35px) scale(1.08); }
}

@keyframes driftB {
  from { transform: translate(0, 0) scale(1); }
  to { transform: translate(-45px, -30px) scale(1.06); }
}

@keyframes driftC {
  from { transform: translate(-50%, -50%) scale(0.95); }
  to { transform: translate(-44%, -54%) scale(1.1); }
}

.starfield {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: 0.28;
  background-image:
    radial-gradient(1px 1px at 14% 22%, rgba(255, 255, 255, 0.7), transparent),
    radial-gradient(1px 1px at 78% 16%, rgba(255, 215, 225, 0.65), transparent),
    radial-gradient(1.2px 1.2px at 41% 74%, rgba(215, 225, 255, 0.55), transparent),
    radial-gradient(1px 1px at 88% 68%, rgba(255, 255, 255, 0.6), transparent),
    radial-gradient(1px 1px at 26% 88%, rgba(255, 190, 210, 0.5), transparent),
    radial-gradient(1px 1px at 62% 35%, rgba(255, 255, 255, 0.45), transparent);
}

/* ---------- iOS 26 LIQUID GLASS MATERIAL ---------- */
.liquid-glass {
  position: relative;
  background: linear-gradient(
    162deg,
    rgba(30, 30, 36, 0.56) 0%,
    rgba(14, 14, 18, 0.74) 55%,
    rgba(22, 15, 21, 0.68) 100%
  );
  backdrop-filter: blur(42px) saturate(190%) brightness(1.05);
  -webkit-backdrop-filter: blur(42px) saturate(190%) brightness(1.05);
  box-shadow:
    inset 0 1px 1px rgba(255, 255, 255, 0.16),
    inset 0 -1px 1px rgba(255, 255, 255, 0.04),
    0 30px 70px -22px rgba(0, 0, 0, 0.92);
}

.liquid-glass::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.34) 0%,
    rgba(255, 255, 255, 0.09) 28%,
    rgba(255, 255, 255, 0.025) 56%,
    rgba(255, 45, 85, 0.16) 84%,
    rgba(255, 255, 255, 0.22) 100%
  );
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
  z-index: 4;
}

.liquid-sheen {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  opacity: 0;
  background: radial-gradient(
    360px circle at var(--mx, 50%) var(--my, 15%),
    rgba(255, 255, 255, 0.075),
    transparent 62%
  );
  transition: opacity 0.35s ease;
  z-index: 3;
}

.liquid-glass:hover > .liquid-sheen {
  opacity: 1;
}

/* ---------- ENTRANCE ANIMATION ---------- */
.reveal {
  animation: surfaceIn 0.72s var(--ease-spring) both;
}
.reveal-1 { animation-delay: 0.03s; }
.reveal-2 { animation-delay: 0.1s; }
.reveal-3 { animation-delay: 0.16s; }
.reveal-4 { animation-delay: 0.22s; }
.reveal-5 { animation-delay: 0.28s; }

@keyframes surfaceIn {
  from {
    opacity: 0;
    transform: translateY(14px) scale(0.985);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* ---------- MAIN STAGE ---------- */
.stage {
  width: 100%;
  max-width: 920px;
  margin-top: auto;
  margin-bottom: auto;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

/* ---------- iOS 26 DYNAMIC ISLAND ---------- */
.island-wrap {
  display: flex;
  justify-content: center;
}

.dynamic-island {
  position: relative;
  border: 0;
  padding: 7px 14px 7px 8px;
  border-radius: 9999px;
  min-width: 196px;
  max-width: 340px;
  color: var(--label-primary);
  font-family: inherit;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 11px;
  overflow: hidden;
  transition:
    transform 0.42s var(--ease-spring),
    padding 0.45s var(--ease-spring),
    min-width 0.45s var(--ease-spring),
    box-shadow 0.4s ease;
}

.dynamic-island:hover {
  transform: translateY(-1px) scale(1.015);
}

.dynamic-island:active {
  transform: scale(0.97);
}

.dynamic-island:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.42);
}

.dynamic-island.is-playing {
  min-width: 248px;
  padding: 7px 15px 7px 8px;
}

.island-art {
  position: relative;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, 0.06);
  overflow: hidden;
  transition: border-radius 0.4s var(--ease-spring);
}

.dynamic-island.is-playing .island-art {
  border-radius: 8px;
}

.island-art img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.dynamic-island.is-playing .island-art img {
  opacity: 1;
}

.island-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--apple-green);
  box-shadow: 0 0 10px rgba(48, 209, 88, 0.8);
  animation: breathe 2.8s ease-in-out infinite;
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.dynamic-island.is-playing .island-dot {
  opacity: 0;
  transform: scale(0.4);
}

@keyframes breathe {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.62; transform: scale(0.88); }
}

.island-text {
  flex: 1;
  min-width: 0;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.island-title {
  font-size: 0.76rem;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--label-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.island-sub {
  font-size: 0.66rem;
  font-weight: 500;
  color: var(--label-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.island-eq {
  display: inline-flex;
  align-items: flex-end;
  gap: 2px;
  height: 12px;
  flex-shrink: 0;
  margin-left: 4px;
}

.island-eq i {
  display: block;
  width: 2px;
  height: 3px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.3);
  transition: background 0.25s ease;
}

.dynamic-island.is-playing .island-eq i {
  background: linear-gradient(180deg, #FFFFFF, var(--emo-crimson));
  animation: eqBar 0.78s ease-in-out infinite alternate;
}

.dynamic-island.is-playing .island-eq i:nth-child(1) { animation-delay: 0s; }
.dynamic-island.is-playing .island-eq i:nth-child(2) { animation-delay: 0.22s; }
.dynamic-island.is-playing .island-eq i:nth-child(3) { animation-delay: 0.44s; }
.dynamic-island.is-playing .island-eq i:nth-child(4) { animation-delay: 0.14s; }

@keyframes eqBar {
  0% { height: 3px; }
  100% { height: 12px; }
}

/* ---------- BENTO GRID ---------- */
.bento-grid {
  display: grid;
  grid-template-columns: minmax(320px, 386px) minmax(0, 1fr);
  gap: 24px;
  align-items: stretch;
}

.col-left {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* ---------- PROFILE POSTER CARD (NO BORING CIRCLE IN BOX) ---------- */
.profile-card {
  border-radius: var(--radius-xl);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  flex: 1;
  transition: transform 0.55s var(--ease-spring);
}

.hero-poster {
  position: relative;
  height: 124px;
  overflow: hidden;
  background: linear-gradient(135deg, #1b0b12 0%, #101018 55%, #09090d 100%);
}

.hero-poster-blur {
  position: absolute;
  inset: -24px;
  background-size: cover;
  background-position: center;
  filter: blur(26px) saturate(1.4) brightness(0.62) contrast(1.1);
  transform: scale(1.28);
  opacity: 0.78;
}

.hero-poster-tint {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(85% 90% at 22% 20%, rgba(255, 45, 85, 0.24), transparent 65%),
    radial-gradient(80% 90% at 85% 25%, rgba(94, 92, 230, 0.22), transparent 65%),
    linear-gradient(180deg, rgba(8, 8, 12, 0.08) 0%, rgba(12, 12, 16, 0.96) 100%);
}

.hero-poster-streak {
  position: absolute;
  inset: 0;
  background: linear-gradient(118deg, transparent 28%, rgba(255, 255, 255, 0.065) 48%, transparent 66%);
  pointer-events: none;
}

.hero-ornament {
  position: absolute;
  top: 14px;
  right: 16px;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px;
  border-radius: 9999px;
  background: rgba(12, 12, 16, 0.56);
  border: 1px solid rgba(255, 255, 255, 0.14);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  font-size: 0.68rem;
  font-weight: 500;
  letter-spacing: 0.03em;
  color: rgba(245, 245, 248, 0.85);
}

.hero-ornament-star {
  color: var(--emo-crimson);
  font-size: 0.72rem;
}

.profile-body {
  position: relative;
  z-index: 2;
  padding: 0 28px 28px;
  margin-top: -54px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  flex: 1;
}

.avatar-prism {
  position: relative;
  width: 108px;
  height: 108px;
  margin-bottom: 16px;
}

.avatar-eclipse {
  position: absolute;
  inset: -12px;
  border-radius: 38px;
  background:
    radial-gradient(circle at 30% 25%, rgba(255, 45, 85, 0.36), transparent 60%),
    radial-gradient(circle at 75% 78%, rgba(94, 92, 230, 0.32), transparent 62%);
  filter: blur(16px);
  opacity: 0.72;
  transition: opacity 0.45s ease, transform 0.55s var(--ease-spring);
  pointer-events: none;
}

.profile-card:hover .avatar-eclipse {
  opacity: 0.95;
  transform: scale(1.06);
}

.avatar-squircle {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 30px;
  overflow: hidden;
  background: linear-gradient(155deg, #1f1b24, #0d0d12);
  box-shadow:
    0 18px 38px rgba(0, 0, 0, 0.78),
    inset 0 1px 1px rgba(255, 255, 255, 0.25);
  display: grid;
  place-items: center;
  transition: transform 0.5s var(--ease-spring);
}

.profile-card:hover .avatar-squircle {
  transform: translateY(-2px) scale(1.02);
}

.avatar-squircle::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1.5px;
  background: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.5) 0%,
    rgba(255, 255, 255, 0.12) 40%,
    rgba(255, 45, 85, 0.42) 100%
  );
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

.avatar-fallback {
  font-size: 2.25rem;
  font-weight: 700;
  letter-spacing: -0.04em;
  color: rgba(245, 245, 248, 0.42);
  user-select: none;
}

.avatar-squircle img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.avatar-live-dot {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--apple-green);
  border: 3.5px solid #101014;
  box-shadow: 0 0 14px rgba(48, 209, 88, 0.65);
  z-index: 3;
}

.profile-name {
  margin: 0;
  font-size: 1.85rem;
  font-weight: 700;
  line-height: 1.12;
  letter-spacing: -0.035em;
  background: linear-gradient(180deg, #FFFFFF 22%, rgba(215, 217, 232, 0.72) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.profile-caption {
  margin-top: 8px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--label-secondary);
  letter-spacing: 0.01em;
}

.profile-caption .sep {
  color: rgba(255, 45, 85, 0.82);
  font-size: 0.75rem;
}

/* ---------- SOCIAL CARDS (iOS 26 LIQUID GLASS ICONS) ---------- */
.socials-section {
  display: flex;
  flex-direction: column;
}

.section-label {
  margin: 0 0 10px 8px;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--label-tertiary);
}

.links-stack {
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.social-card {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 13px 16px;
  text-decoration: none;
  color: var(--label-primary);
  border-radius: var(--radius-lg);
  overflow: hidden;
  transition:
    transform 0.42s var(--ease-spring),
    background 0.3s ease,
    box-shadow 0.42s var(--ease-spring);
}

.social-card:hover {
  transform: translateY(-2px);
  background: linear-gradient(
    162deg,
    rgba(42, 42, 50, 0.64) 0%,
    rgba(20, 20, 26, 0.78) 100%
  );
}

.social-card:active {
  transform: scale(0.985);
  transition-duration: 0.12s;
}

.social-card:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.38);
}

.ios26-icon {
  position: relative;
  z-index: 2;
  width: 50px;
  height: 50px;
  flex-shrink: 0;
  filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.55));
  transition: transform 0.45s var(--ease-spring), filter 0.35s ease;
}

.ios26-icon svg {
  width: 100%;
  height: 100%;
}

.social-card:hover .ios26-icon {
  transform: scale(1.06) translateY(-1px);
}

.social-card[data-brand="tiktok"]:hover .ios26-icon {
  filter: drop-shadow(0 10px 20px rgba(254, 44, 85, 0.25)) drop-shadow(0 4px 12px rgba(37, 244, 238, 0.18));
}

.social-card[data-brand="instagram"]:hover .ios26-icon {
  filter: drop-shadow(0 10px 20px rgba(255, 45, 110, 0.28));
}

.social-card[data-brand="roblox"]:hover .ios26-icon {
  filter: drop-shadow(0 10px 20px rgba(220, 225, 255, 0.2));
}

.social-meta {
  position: relative;
  z-index: 2;
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.social-title {
  font-size: 0.95rem;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--label-primary);
}

.social-sub {
  font-size: 0.8125rem;
  font-weight: 400;
  color: var(--label-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.social-arrow {
  position: relative;
  z-index: 2;
  width: 30px;
  height: 30px;
  flex-shrink: 0;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, 0.045);
  border: 1px solid rgba(255, 255, 255, 0.075);
  color: var(--label-tertiary);
  transition:
    transform 0.4s var(--ease-spring),
    color 0.25s ease,
    background 0.25s ease,
    border-color 0.25s ease;
}

.social-arrow svg {
  width: 14px;
  height: 14px;
}

.social-card:hover .social-arrow {
  color: var(--label-primary);
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.18);
  transform: translate(2px, -2px);
}

/* ---------- MUSIC PLAYER CARD ---------- */
.player-card {
  border-radius: var(--radius-xl);
  overflow: hidden;
  padding: 26px 28px;
  display: flex;
  flex-direction: column;
}

.player-ambient {
  position: absolute;
  inset: -48px;
  z-index: 0;
  background-size: cover;
  background-position: center;
  filter: blur(74px) saturate(1.55) brightness(0.42);
  opacity: 0.22;
  pointer-events: none;
  transition: opacity 0.65s ease;
}

.player-card.is-playing .player-ambient {
  opacity: 0.36;
}

.player-inner {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  height: 100%;
}

.player-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.player-head-label {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--label-tertiary);
}

.player-state-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 11px;
  border-radius: 9999px;
  background: rgba(255, 255, 255, 0.055);
  border: 1px solid rgba(255, 255, 255, 0.09);
  font-size: 0.7rem;
  font-weight: 500;
  color: var(--label-secondary);
  transition: color 0.25s ease, border-color 0.25s ease, background 0.25s ease;
}

.player-card.is-playing .player-state-pill {
  color: var(--label-primary);
  background: rgba(255, 45, 85, 0.14);
  border-color: rgba(255, 45, 85, 0.3);
}

.state-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--label-tertiary);
  transition: background 0.25s ease, box-shadow 0.25s ease;
}

.player-card.is-playing .state-dot {
  background: var(--emo-crimson);
  box-shadow: 0 0 10px rgba(255, 45, 85, 0.85);
}

/* Now Playing + Vinyl Jewel Stage */
.now-playing {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 20px;
}

.cover-stage {
  position: relative;
  width: 112px;
  height: 92px;
  flex-shrink: 0;
}

.vinyl-disc {
  position: absolute;
  top: 5px;
  right: 12px;
  width: 82px;
  height: 82px;
  border-radius: 50%;
  background:
    radial-gradient(circle, #18181d 0 14%, #060608 15% 18%, transparent 19%),
    repeating-radial-gradient(circle, rgba(255, 255, 255, 0.05) 0 1px, rgba(8, 8, 10, 0.96) 1px 4px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.75);
  transition: transform 0.65s var(--ease-spring);
}

.vinyl-disc::after {
  content: "";
  position: absolute;
  inset: 28px;
  border-radius: 50%;
  background: radial-gradient(circle, #0e0e12 0 28%, rgba(255, 45, 85, 0.75) 30%, rgba(120, 18, 42, 0.9) 100%);
  border: 1px solid rgba(255, 255, 255, 0.16);
}

.vinyl-spin {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  animation: vinylRotate 11s linear infinite;
  animation-play-state: paused;
}

.player-card.is-playing .vinyl-disc {
  transform: translateX(12px);
}

.player-card.is-playing .vinyl-spin {
  animation-play-state: running;
}

@keyframes vinylRotate {
  to { transform: rotate(360deg); }
}

.cover-glow {
  position: absolute;
  left: 4px;
  top: 8px;
  width: 84px;
  height: 84px;
  border-radius: 18px;
  background-size: cover;
  background-position: center;
  filter: blur(20px) saturate(1.4);
  opacity: 0.25;
  transition: opacity 0.55s ease, transform 0.55s var(--ease-spring);
  pointer-events: none;
}

.player-card.is-playing .cover-glow {
  opacity: 0.58;
  transform: scale(1.06);
}

.cover-frame {
  position: relative;
  z-index: 2;
  width: 92px;
  height: 92px;
  border-radius: 18px;
  overflow: hidden;
  background: linear-gradient(145deg, #22202a, #111015);
  border: 1px solid rgba(255, 255, 255, 0.16);
  box-shadow:
    inset 0 1px 1px rgba(255, 255, 255, 0.2),
    0 12px 28px rgba(0, 0, 0, 0.65);
  display: grid;
  place-items: center;
  transform: scale(0.96);
  transition: transform 0.55s var(--ease-spring), box-shadow 0.55s ease;
}

.player-card.is-playing .cover-frame {
  transform: scale(1);
  box-shadow:
    inset 0 1px 1px rgba(255, 255, 255, 0.24),
    0 18px 38px rgba(0, 0, 0, 0.8);
}

.cover-fallback {
  width: 28px;
  height: 28px;
  color: rgba(255, 255, 255, 0.24);
}

.cover-frame img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: opacity 0.26s ease;
}

.track-meta {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.track-title {
  margin: 0;
  font-size: 1.08rem;
  font-weight: 600;
  line-height: 1.24;
  letter-spacing: -0.02em;
  color: var(--label-primary);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  transition: opacity 0.2s ease, transform 0.25s var(--ease-spring);
}

.track-artist {
  font-size: 0.875rem;
  font-weight: 400;
  color: var(--label-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: opacity 0.2s ease, transform 0.25s var(--ease-spring);
}

.is-swapping {
  opacity: 0;
  transform: translateY(4px);
}

/* ---------- INTERACTIVE ACOUSTIC WAVEFORM SCRUBBER ---------- */
.scrubber-wrap {
  margin-bottom: 18px;
}

.waveform-seek {
  position: relative;
  height: 44px;
  padding: 0 2px;
  display: flex;
  align-items: center;
  cursor: pointer;
  touch-action: none;
  outline: none;
  border-radius: 12px;
}

.waveform-seek:focus-visible {
  box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.36);
}

.wave-bars {
  width: 100%;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 3px;
}

.wave-bar {
  flex: 1;
  min-width: 2px;
  height: calc(var(--h, 40%) * var(--hover-scale, 1));
  max-height: 36px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.14);
  transform-origin: center;
  transition:
    height 0.38s var(--ease-spring),
    background 0.18s ease,
    box-shadow 0.2s ease,
    transform 0.16s ease;
}

.wave-bar.is-buffered {
  background: rgba(255, 255, 255, 0.25);
}

.wave-bar.is-hover {
  background: rgba(255, 255, 255, 0.44);
}

.wave-bar.is-played {
  background: linear-gradient(180deg, #FFFFFF 0%, rgba(255, 110, 140, 0.92) 100%);
  box-shadow: 0 0 10px rgba(255, 45, 85, 0.22);
}

.wave-bar.is-head {
  background: #FFFFFF;
  box-shadow: 0 0 12px rgba(255, 45, 85, 0.65), 0 0 4px rgba(255, 255, 255, 0.8);
}

.wave-tooltip {
  position: absolute;
  top: -24px;
  left: 0;
  transform: translate(-50%, 4px);
  padding: 3px 8px;
  border-radius: 9999px;
  background: rgba(22, 22, 28, 0.88);
  border: 1px solid rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  font-size: 0.68rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--label-primary);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.16s ease, transform 0.18s var(--ease-spring);
  white-space: nowrap;
}

.waveform-seek.show-tip .wave-tooltip {
  opacity: 1;
  transform: translate(-50%, 0);
}

.times {
  display: flex;
  justify-content: space-between;
  margin-top: 4px;
  font-size: 0.72rem;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--label-tertiary);
}

/* ---------- LIQUID GLASS TRANSPORT CONTROLS ---------- */
.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-bottom: 18px;
}

.ctrl-btn {
  position: relative;
  border: 0;
  padding: 0;
  margin: 0;
  background: transparent;
  color: var(--label-secondary);
  cursor: pointer;
  display: grid;
  place-items: center;
  border-radius: 50%;
  transition:
    transform 0.34s var(--ease-spring),
    color 0.2s ease,
    background 0.22s ease,
    box-shadow 0.28s ease;
}

.ctrl-btn:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.38);
}

.ctrl-btn.sm {
  width: 38px;
  height: 38px;
  color: var(--label-tertiary);
}

.ctrl-btn.sm svg {
  width: 17px;
  height: 17px;
}

.ctrl-btn.md {
  width: 44px;
  height: 44px;
  color: var(--label-primary);
  background: rgba(255, 255, 255, 0.045);
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
}

.ctrl-btn.md svg {
  width: 21px;
  height: 21px;
}

.ctrl-btn.sm:hover {
  color: var(--label-primary);
  background: rgba(255, 255, 255, 0.08);
}

.ctrl-btn.md:hover {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.18);
  transform: translateY(-1px);
}

.ctrl-btn.sm:active,
.ctrl-btn.md:active {
  transform: scale(0.9);
}

.ctrl-btn.sm.is-on {
  color: var(--emo-crimson);
  background: rgba(255, 45, 85, 0.14);
}

.ctrl-btn.sm.is-on::after {
  content: "";
  position: absolute;
  bottom: 3px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--emo-crimson);
  box-shadow: 0 0 8px rgba(255, 45, 85, 0.85);
}

.ctrl-btn.play {
  width: 58px;
  height: 58px;
  background: linear-gradient(160deg, rgba(255, 255, 255, 0.96), rgba(220, 222, 232, 0.88));
  color: #070709;
  border: 1px solid rgba(255, 255, 255, 0.65);
  box-shadow:
    inset 0 2px 3px rgba(255, 255, 255, 0.9),
    0 10px 28px rgba(0, 0, 0, 0.52),
    0 0 26px rgba(255, 45, 85, 0.12);
}

.player-card.is-playing .ctrl-btn.play {
  box-shadow:
    inset 0 2px 3px rgba(255, 255, 255, 0.9),
    0 12px 32px rgba(0, 0, 0, 0.58),
    0 0 30px rgba(255, 45, 85, 0.25);
}

.ctrl-btn.play svg {
  width: 23px;
  height: 23px;
}

.ctrl-btn.play:hover {
  transform: scale(1.06);
  background: #FFFFFF;
}

.ctrl-btn.play:active {
  transform: scale(0.94);
}

/* ---------- VOLUME ---------- */
.volume-row {
  display: flex;
  align-items: center;
  gap: 11px;
  padding-bottom: 16px;
  margin-bottom: 14px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.065);
}

.vol-icon-btn {
  width: 28px;
  height: 28px;
  border: 0;
  padding: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--label-tertiary);
  display: grid;
  place-items: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: color 0.2s ease, background 0.2s ease;
}

.vol-icon-btn:hover {
  color: var(--label-primary);
  background: rgba(255, 255, 255, 0.06);
}

.vol-icon-btn:focus-visible {
  outline: none;
  box-shadow: 0 0 0 2px rgba(10, 132, 255, 0.4);
}

.vol-icon-btn svg,
.vol-static svg {
  width: 16px;
  height: 16px;
}

.vol-static {
  width: 20px;
  height: 20px;
  display: grid;
  place-items: center;
  color: var(--label-tertiary);
  flex-shrink: 0;
}

.vol-slider {
  --vol-pct: 70%;
  -webkit-appearance: none;
  appearance: none;
  flex: 1;
  height: 5px;
  border-radius: 9999px;
  background: linear-gradient(
    90deg,
    rgba(255, 255, 255, 0.85) 0%,
    rgba(255, 75, 110, 0.85) var(--vol-pct),
    rgba(255, 255, 255, 0.13) var(--vol-pct)
  );
  outline: none;
  cursor: pointer;
}

.vol-slider:focus-visible {
  box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.32);
}

.vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: #FFFFFF;
  box-shadow: 0 1px 6px rgba(0, 0, 0, 0.65);
  cursor: pointer;
  transition: transform 0.2s var(--ease-spring);
}

.vol-slider:hover::-webkit-slider-thumb {
  transform: scale(1.15);
}

.vol-slider::-moz-range-thumb {
  width: 13px;
  height: 13px;
  border: 0;
  border-radius: 50%;
  background: #FFFFFF;
  box-shadow: 0 1px 6px rgba(0, 0, 0, 0.65);
  cursor: pointer;
}

/* ---------- PLAYLIST ---------- */
.playlist {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.pl-item {
  width: 100%;
  border: 1px solid transparent;
  padding: 8px 10px;
  border-radius: 14px;
  background: transparent;
  color: var(--label-secondary);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
  transition:
    background 0.22s ease,
    border-color 0.22s ease,
    color 0.22s ease,
    transform 0.22s var(--ease-spring);
}

.pl-item:hover {
  background: rgba(255, 255, 255, 0.055);
  color: var(--label-primary);
}

.pl-item:active {
  transform: scale(0.99);
}

.pl-item:focus-visible {
  outline: none;
  box-shadow: inset 0 0 0 2px rgba(10, 132, 255, 0.45);
}

.pl-item.active {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.095), rgba(255, 45, 85, 0.08));
  border-color: rgba(255, 255, 255, 0.11);
  color: var(--label-primary);
}

.pl-thumb {
  position: relative;
  width: 38px;
  height: 38px;
  border-radius: 10px;
  flex-shrink: 0;
  overflow: hidden;
  background: linear-gradient(145deg, #24212b, #121116);
  border: 1px solid rgba(255, 255, 255, 0.1);
  display: grid;
  place-items: center;
}

.pl-thumb svg {
  width: 14px;
  height: 14px;
  color: rgba(255, 255, 255, 0.24);
}

.pl-thumb img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.pl-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.pl-name {
  font-size: 0.84rem;
  font-weight: 500;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.pl-item.active .pl-name {
  font-weight: 600;
}

.pl-artist {
  font-size: 0.73rem;
  color: var(--label-tertiary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.pl-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.pl-eq {
  display: none;
  align-items: flex-end;
  gap: 2px;
  height: 11px;
}

.pl-item.active .pl-eq {
  display: inline-flex;
}

.pl-eq i {
  display: block;
  width: 2px;
  height: 3px;
  border-radius: 2px;
  background: var(--label-secondary);
}

.player-card.is-playing .pl-item.active .pl-eq i {
  background: var(--emo-crimson);
  animation: eqBar 0.8s ease-in-out infinite alternate;
}

.player-card.is-playing .pl-item.active .pl-eq i:nth-child(2) {
  animation-delay: 0.25s;
}

.player-card.is-playing .pl-item.active .pl-eq i:nth-child(3) {
  animation-delay: 0.5s;
}

.pl-dur {
  font-size: 0.72rem;
  font-variant-numeric: tabular-nums;
  color: var(--label-tertiary);
  min-width: 32px;
  text-align: right;
}

/* ---------- FOOTER ---------- */
.footer {
  text-align: center;
  font-size: 0.74rem;
  font-weight: 500;
  letter-spacing: 0.04em;
  color: rgba(235, 235, 245, 0.24);
}

/* ---------- RESPONSIVE ---------- */
@media (max-width: 859px) {
  .stage {
    max-width: 460px;
    gap: 20px;
  }

  .bento-grid {
    grid-template-columns: 1fr;
    gap: 20px;
  }

  .profile-card {
    flex: initial;

@media (max-width: 440px) {

  .social-card {

  .controls {

  .cover-stage {
    width: 100px;

  .cover-frame {

  }

  .vinyl-disc {

  }
}

/* ---------- ACCESSIBILITY ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

/* ---------- ACOUSTIC WAVEFORM BAR SETUP ---------- */
function buildWaveBars() {
  waveBarsEl.innerHTML = "";
  for (let i = 0; i < WAVE_COUNT; i++) {
    const bar = document.createElement("span");
    bar.className = "wave-bar";
    bar.style.setProperty("--h", "36%");
    waveBarsEl.appendChild(bar);
  }
}

function generateTrackWave(seed) {
  const heights = [];
  for (let i = 0; i < WAVE_COUNT; i++) {
    const x = i / (WAVE_COUNT - 1);
    const envelope = 0.45 + 0.55 * Math.sin(x * Math.PI);
    const waveA = Math.abs(Math.sin(i * 0.43 + seed));
    const waveB = Math.abs(Math.cos(i * 0.87 + seed * 1.9));
    const waveC = Math.abs(Math.sin(i * 1.65 + seed * 0.6));
    const raw = (waveA * 0.48 + waveB * 0.34 + waveC * 0.18) * envelope;
    const pct = Math.round(24 + raw * 72);
    heights.push(Math.min(98, Math.max(20, pct)));
  }
  return heights;
}

function applyWaveShape(seed) {
  waveHeights = generateTrackWave(seed);
  const bars = waveBarsEl.children;
  for (let i = 0; i < bars.length; i++) {
    bars[i].style.setProperty("--h", waveHeights[i] + "%");
  }
}

function renderWaveProgress(phase = 0) {
  const bars = waveBarsEl.children;

  const activeHeadIdx = progressPct > 0 ? Math.min(bars.length - 1, Math.floor((progressPct / 100) * bars.length)) : -1;
  const isPlaying = !audio.paused;

  for (let i = 0; i < bars.length; i++) {
    const bar = bars[i];
    const centerPct = ((i + 0.5) / bars.length) * 100;
    const played = centerPct <= progressPct;
    const buffered = !played && centerPct <= bufferedPct;
    const hovered = hoverRatio !== null && !played && centerPct <= hoverRatio * 100;

    bar.classList.toggle("is-played", played);
    bar.classList.toggle("is-buffered", buffered);
    bar.classList.toggle("is-hover", hovered);
    bar.classList.toggle("is-head", i === activeHeadIdx);

    let scale = 1;
    if (hoverRatio !== null) {
      const hoverIdx = hoverRatio * (bars.length - 1);
      const dist = Math.abs(i - hoverIdx);
      if (dist < 4) {
        scale += (1 - dist / 4) * 0.24;
      }
    }
    if (isPlaying) {
      const pulse = 1 + 0.14 * Math.sin(phase * 4.5 + i * 0.55);
      scale *= pulse;
    }
    bar.style.setProperty("--hover-scale", scale.toFixed(3));
  }
}

/* ---------- PLAYLIST ---------- */
function buildPlaylist() {
  plEl.innerHTML = "";
  playlist.forEach((t, i) => {
    const item = document.createElement("button");
    item.type = "button";
    item.className = "pl-item" + (i === currentIdx ? " active" : "");
    item.setAttribute("role", "listitem");

    const artistLine = t.artist && t.artist !== "—" ? `<span class="pl-artist">${t.artist}</span>` : "";
    item.innerHTML = `
      <span class="pl-thumb">
        ${NOTE_SVG}
        <img src="${t.portada}" alt="" loading="lazy" onerror="this.style.opacity='0'">
      </span>
      <span class="pl-info">
        <span class="pl-name">${t.titulo}</span>
        ${artistLine}
      </span>
      <span class="pl-right">
        <span class="pl-eq" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="pl-dur" data-dur="${i}"></span>
      </span>
    `;
    item.addEventListener("click", () => loadTrack(i, true));
    plEl.appendChild(item);
  });
}

function markActive() {
  [...plEl.children].forEach((el, i) => el.classList.toggle("active", i === currentIdx));
}

function syncDynamicIsland(track, playing) {
  dynamicIsland.classList.toggle("is-playing", !!playing);
  if (playing) {
    islandTitle.textContent = track.titulo;
    islandSub.textContent = track.artist && track.artist !== "—" ? track.artist : "Reproduciendo";
    if (islandImg.getAttribute("src") !== track.portada) {
      islandImg.src = track.portada;
    }
  } else {
    islandTitle.textContent = "alejoows";
    islandSub.textContent = "Online · 24/7";
  }
}

function setStatus(playing) {
  playerCard.classList.toggle("is-playing", !!playing);
  statusTxt.textContent = playing ? "Reproduciendo" : "Pausado";
  playBtn.innerHTML = playing ? PAUSE_SVG : PLAY_SVG;
  playBtn.setAttribute("aria-label", playing ? "Pausar" : "Reproducir");
  syncDynamicIsland(playlist[currentIdx], playing);
  renderWaveProgress(performance.now() * 0.001);
}

function applyTrackVisuals(track) {
  titleEl.textContent = track.titulo;
  artistEl.textContent = track.artist || "—";
  if (coverImg.getAttribute("src") === track.portada) {
    if (coverImg.complete && coverImg.naturalWidth > 0) {
      coverImg.style.opacity = "1";
    }
  } else {
    coverImg.style.opacity = "0";
    coverImg.src = track.portada;
  }
  const bg = `url('${track.portada}')`;
  playerAmbient.style.backgroundImage = bg;
  coverGlow.style.backgroundImage = bg;
  applyWaveShape(track.seed);
}

function loadTrack(idx, startPlaying = false) {
  const nextIdx = ((idx % playlist.length) + playlist.length) % playlist.length;

  if (initialized && nextIdx === currentIdx) {
    if (startPlaying && audio.paused) {
      audio.play().then(() => setStatus(true)).catch(() => setStatus(false));
    }
    return;
  }

  currentIdx = nextIdx;
  const track = playlist[currentIdx];

  audio.src = track.url;
  progressPct = 0;
  bufferedPct = 0;
  curEl.textContent = "0:00";
  durEl.textContent = "0:00";
  seekEl.setAttribute("aria-valuenow", "0");
  markActive();
  renderWaveProgress();

  if (!initialized) {
    initialized = true;
    applyTrackVisuals(track);
    setStatus(false);
  } else {
    titleEl.classList.add("is-swapping");
    artistEl.classList.add("is-swapping");
    coverImg.style.opacity = "0";
    setTimeout(() => {
      applyTrackVisuals(track);
      titleEl.classList.remove("is-swapping");
      artistEl.classList.remove("is-swapping");
    }, 160);
    setStatus(startPlaying);
  }

  if (startPlaying) {
    setTimeout(() => {
      audio.play().catch(() => setStatus(false));
    }, 180);
  }
}

function togglePlay() {
  if (audio.paused) {
    audio.play().then(() => setStatus(true)).catch(() => setStatus(false));
  } else {
    audio.pause();
    setStatus(false);
  }
}

function pickNext(dir) {
  if (shuffle && playlist.length > 1) {
    let n;
    do {
      n = Math.floor(Math.random() * playlist.length);
    } while (n === currentIdx);
    return n;
  }
  return (currentIdx + dir + playlist.length) % playlist.length;
}

const nextTrack = () => loadTrack(pickNext(1), !audio.paused);
const prevTrack = () => {
  if (audio.currentTime > 3) {
    audio.currentTime = 0;
    return;
  }
  loadTrack(pickNext(-1), !audio.paused);
};

dynamicIsland.addEventListener("click", togglePlay);
playBtn.addEventListener("click", togglePlay);
$('nextBtn').addEventListener("click", nextTrack);
$('prevBtn').addEventListener("click", prevTrack);

shuffleBtn.addEventListener("click", () => {
  shuffle = !shuffle;
  shuffleBtn.classList.toggle("is-on", shuffle);
  shuffleBtn.setAttribute("aria-pressed", String(shuffle));
});

repeatBtn.addEventListener("click", () => {
  repeatOne = !repeatOne;
  repeatBtn.classList.toggle("is-on", repeatOne);
  repeatBtn.setAttribute("aria-pressed", String(repeatOne));
});

audio.addEventListener("ended", () => {
  if (repeatOne) {
    audio.currentTime = 0;
    audio.play().catch(() => setStatus(false));
  } else {
    loadTrack(pickNext(1), true);
  }
});

audio.addEventListener("play", () => setStatus(true));
audio.addEventListener("pause", () => setStatus(false));

audio.addEventListener("loadedmetadata", () => {
  const formatted = fmt(audio.duration);
  durEl.textContent = formatted;
  const d = plEl.querySelector(`[data-dur="${currentIdx}"]`);
  if (d) d.textContent = formatted;
});

audio.addEventListener("timeupdate", () => {
  progressPct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  curEl.textContent = fmt(audio.currentTime);
  seekEl.setAttribute("aria-valuenow", String(Math.round(progressPct)));
  if (audio.paused) renderWaveProgress();
});

audio.addEventListener("progress", () => {
  try {
    if (audio.buffered.length && audio.duration) {
      bufferedPct = (audio.buffered.end(audio.buffered.length - 1) / audio.duration) * 100;
      if (audio.paused) renderWaveProgress();
    }
  } catch (_) {}
});

function getRatioFromEvent(clientX) {
  const rect = seekEl.getBoundingClientRect();
  return rect.width ? Math.min(1, Math.max(0, (clientX - rect.left) / rect.width)) : 0;
}

function updateTooltip(ratio) {
  if (!isFinite(audio.duration) || audio.duration <= 0) {
    seekEl.classList.remove("show-tip");
    return;
  }
  const rect = seekEl.getBoundingClientRect();
  const px = Math.min(rect.width - 20, Math.max(20, ratio * rect.width));
  waveTooltip.style.left = px + "px";
  waveTooltip.textContent = fmt(ratio * audio.duration);
  seekEl.classList.add("show-tip");
}

function seekToRatio(ratio) {
  progressPct = ratio * 100;
  if (audio.duration) {
    audio.currentTime = ratio * audio.duration;
  }
  renderWaveProgress(performance.now() * 0.001);
}

seekEl.addEventListener("pointerdown", e => {
  dragging = true;
  hoverRatio = getRatioFromEvent(e.clientX);
  seekEl.setPointerCapture(e.pointerId);
  updateTooltip(hoverRatio);
  seekToRatio(hoverRatio);
});

seekEl.addEventListener("pointermove", e => {
  hoverRatio = getRatioFromEvent(e.clientX);
  updateTooltip(hoverRatio);
  if (dragging) {
    seekToRatio(hoverRatio);
  } else {
    renderWaveProgress(performance.now() * 0.001);
  }
});

seekEl.addEventListener("pointerleave", () => {
  if (!dragging) {
    hoverRatio = null;
    seekEl.classList.remove("show-tip");
    renderWaveProgress(performance.now() * 0.001);
  }
});

seekEl.addEventListener("pointerup", () => {
  dragging = false;
  hoverRatio = null;
  seekEl.classList.remove("show-tip");
  renderWaveProgress(performance.now() * 0.001);
});

seekEl.addEventListener("pointercancel", () => {
  dragging = false;
  hoverRatio = null;
  seekEl.classList.remove("show-tip");
  renderWaveProgress(performance.now() * 0.001);
});

seekEl.addEventListener("keydown", e => {
  if (!audio.duration) return;
  if (e.key === "ArrowRight") {
    audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
    e.preventDefault();
  } else if (e.key === "ArrowLeft") {
    audio.currentTime = Math.max(0, audio.currentTime - 5);
    e.preventDefault();
  } else if (e.key === " " || e.key === "Enter") {
    togglePlay();
    e.preventDefault();
  }
});

document.addEventListener("keydown", e => {
  const tag = e.target && e.target.tagName;
  if (tag === "INPUT" || tag === "BUTTON" || tag === "A") return;
  if (e.code === "Space" && e.target !== seekEl) {
    togglePlay();
    e.preventDefault();
  } else if (e.code === "ArrowRight" && e.shiftKey) {
    nextTrack();
  } else if (e.code === "ArrowLeft" && e.shiftKey) {
    prevTrack();
  }
});

function updateVolumeUI(val) {
  const numeric = Number(val);
  audio.volume = numeric / 100;
  volEl.value = String(numeric);
  volEl.style.setProperty("--vol-pct", numeric + "%");
  volIconLow.innerHTML = numeric === 0 ? VOL_MUTE_SVG : VOL_LOW_SVG;
  muteBtn.setAttribute("aria-label", numeric === 0 ? "Activar audio" : "Silenciar");
}

volEl.addEventListener("input", () => {
  const v = Number(volEl.value);
  if (v > 0) lastVolume = v;
  updateVolumeUI(v);
});

muteBtn.addEventListener("click", () => {
  if (Number(volEl.value) === 0) {
    updateVolumeUI(lastVolume || 70);
  } else {
    lastVolume = Number(volEl.value);
    updateVolumeUI(0);
  }
});

function animateWaveLoop(now) {
  if (!audio.paused) {
    renderWaveProgress(now * 0.001);
  }
  requestAnimationFrame(animateWaveLoop);
}

buildWaveBars();
updateVolumeUI(70);
buildPlaylist();
loadTrack(0, false);
requestAnimationFrame(animateWaveLoop);
</script>
</body>
</html>
