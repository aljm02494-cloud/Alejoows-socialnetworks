<style>
/* ============================================================
   ALEJOOWS — iOS 26 DARK / MINIMALIST EDITION
   ============================================================ */
:root {
  --bg-canvas: #000000;
  --glass-bg: rgba(26, 26, 29, 0.72);
  --glass-bg-elevated: rgba(36, 36, 40, 0.76);
  --glass-border: rgba(255, 255, 255, 0.09);
  --glass-border-hover: rgba(255, 255, 255, 0.16);

  --label-primary: #F5F5F7;
  --label-secondary: rgba(235, 235, 245, 0.58);
  --label-tertiary: rgba(235, 235, 245, 0.34);

  --system-green: #30D158;
  --system-blue: #0A84FF;

  --radius-xl: 28px;
  --radius-lg: 20px;
  --radius-md: 14px;

  --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

*, *::before, *::after {
  box-sizing: border-box;
}

html {
  height: 100%;
  background: var(--bg-canvas);
  color-scheme: dark;
}

body {
  margin: 0;
  min-height: 100dvh;
  padding: clamp(24px, 5vh, 56px) clamp(16px, 4vw, 32px) clamp(24px, 4vh, 40px);
  background: radial-gradient(100% 80% at 50% 0%, #0E0E10 0%, #040405 60%, #000000 100%);
  color: var(--label-primary);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

img, svg {
  display: block;
}

::selection {
  background: rgba(255, 255, 255, 0.22);
  color: #FFFFFF;
}

/* ---------- iOS 26 LIQUID GLASS SURFACE ---------- */
.glass {
  position: relative;
  background: var(--glass-bg);
  backdrop-filter: blur(36px) saturate(165%);
  -webkit-backdrop-filter: blur(36px) saturate(165%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.14),
    inset 0 -1px 0 rgba(255, 255, 255, 0.03),
    0 20px 50px -20px rgba(0, 0, 0, 0.85);
}

.glass::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(
    145deg,
    rgba(255, 255, 255, 0.22) 0%,
    rgba(255, 255, 255, 0.06) 35%,
    rgba(255, 255, 255, 0.03) 70%,
    rgba(255, 255, 255, 0.12) 100%
  );
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
  z-index: 3;
}

/* ---------- ENTRANCE ---------- */
.reveal {
  animation: fadeSlide 0.55s var(--ease-spring) both;
}
.reveal-1 { animation-delay: 0.02s; }
.reveal-2 { animation-delay: 0.08s; }
.reveal-3 { animation-delay: 0.14s; }
.reveal-4 { animation-delay: 0.2s; }

@keyframes fadeSlide {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ---------- LAYOUT ---------- */
.stage {
  width: 100%;
  max-width: 868px;
  margin-top: auto;
  margin-bottom: auto;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

/* ---------- TOP COMPACT DYNAMIC PILL ---------- */
.pill-bar {
  display: flex;
  justify-content: center;
}

.dynamic-pill {
  position: relative;
  border: 0;
  padding: 6px 14px 6px 7px;
  border-radius: 9999px;
  min-width: 184px;
  max-width: 320px;
  color: var(--label-primary);
  font-family: inherit;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  transition:
    transform 0.35s var(--ease-spring),
    min-width 0.4s var(--ease-spring),
    background 0.25s ease;
}

.dynamic-pill:hover {
  background: var(--glass-bg-elevated);
}

.dynamic-pill:active {
  transform: scale(0.97);
}

.dynamic-pill:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.4);
}

.dynamic-pill.is-playing {
  min-width: 236px;
}

.pill-thumb {
  position: relative;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, 0.06);
  overflow: hidden;
  transition: border-radius 0.35s var(--ease-spring);
}

.dynamic-pill.is-playing .pill-thumb {
  border-radius: 7px;
}

.pill-note {
  position: absolute;
  width: 12px;
  height: 12px;
  color: rgba(255, 255, 255, 0.35);
  opacity: 0;
  transition: opacity 0.2s ease;
}

.dynamic-pill.is-playing .pill-note {
  opacity: 1;
}

.pill-thumb img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 0.25s ease;
}

.dynamic-pill.is-playing .pill-thumb img {
  opacity: 1;
}

.pill-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--system-green);
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.dynamic-pill.is-playing .pill-dot {
  opacity: 0;
  transform: scale(0.4);
}

.pill-text {
  flex: 1;
  min-width: 0;
  text-align: left;
  display: flex;
  flex-direction: column;
}

.pill-title {
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--label-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.pill-sub {
  font-size: 0.65rem;
  color: var(--label-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.pill-eq {
  display: inline-flex;
  align-items: flex-end;
  gap: 2px;
  height: 11px;
  flex-shrink: 0;
}

.pill-eq i {
  display: block;
  width: 2px;
  height: 3px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.26);
  transition: background 0.2s ease;
}

.dynamic-pill.is-playing .pill-eq i {
  background: var(--label-primary);
  animation: eqBar 0.8s ease-in-out infinite alternate;
}

.dynamic-pill.is-playing .pill-eq i:nth-child(2) { animation-delay: 0.24s; }
.dynamic-pill.is-playing .pill-eq i:nth-child(3) { animation-delay: 0.48s; }

@keyframes eqBar {
  0% { height: 3px; }
  100% { height: 11px; }
}

/* ---------- BENTO GRID ---------- */
.bento {
  display: grid;
  grid-template-columns: minmax(310px, 368px) minmax(0, 1fr);
  gap: 22px;
  align-items: stretch;
}

.col-left {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* ---------- EDITORIAL PROFILE CARD ---------- */
.profile-card {
  border-radius: var(--radius-xl);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.poster-band {
  position: relative;
  flex: 1;
  min-height: 108px;
  overflow: hidden;
  background: #141416;
}

.poster-blur {
  position: absolute;
  inset: -24px;
  background-size: cover;
  background-position: center;
  filter: blur(22px) grayscale(0.7) contrast(1.15) brightness(0.46);
  transform: scale(1.25);
}

.poster-fade {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(16, 16, 18, 0.12) 0%, rgba(22, 22, 25, 0.96) 100%);
}

.profile-main {
  position: relative;
  z-index: 2;
  flex: 0 0 auto;
  padding: 0 24px 24px;
  margin-top: -42px;
}

.profile-row {
  display: flex;
  align-items: flex-end;
  gap: 16px;
}

.avatar-squircle {
  position: relative;
  width: 86px;
  height: 86px;
  flex-shrink: 0;
  border-radius: 22px;
  overflow: hidden;
  background: #18181B;
  border: 1px solid rgba(255, 255, 255, 0.16);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.65);
  display: grid;
  place-items: center;
}

.avatar-fallback {
  font-size: 1.9rem;
  font-weight: 600;
  letter-spacing: -0.04em;
  color: rgba(245, 245, 247, 0.42);
  user-select: none;
}

.avatar-squircle img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.profile-text {
  min-width: 0;
  padding-bottom: 4px;
}

.profile-name {
  margin: 0;
  font-size: 1.625rem;
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: -0.03em;
  color: var(--label-primary);
}

.profile-status {
  margin-top: 6px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--label-secondary);
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--system-green);
}

/* ---------- SOCIAL LINKS ---------- */
.socials-section {
  display: flex;
  flex-direction: column;
}

.section-label {
  margin: 0 0 10px 6px;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--label-tertiary);
}

.links-stack {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.social-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 13px 16px;
  text-decoration: none;
  color: var(--label-primary);
  border-radius: var(--radius-lg);
  transition:
    transform 0.35s var(--ease-spring),
    background 0.22s ease;
}

.social-card:hover {
  transform: translateY(-2px);
  background: var(--glass-bg-elevated);
}

.social-card:active {
  transform: scale(0.985);
  transition-duration: 0.1s;
}

.social-card:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.38);
}

.ios-icon {
  width: 46px;
  height: 46px;
  flex-shrink: 0;
  transition: transform 0.35s var(--ease-spring);
}

.ios-icon svg {
  width: 100%;
  height: 100%;
}

.social-card:hover .ios-icon {
  transform: scale(1.04);
}

.social-meta {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.social-title {
  font-size: 0.9375rem;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--label-primary);
}

.social-sub {
  font-size: 0.8rem;
  color: var(--label-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.social-arrow {
  width: 28px;
  height: 28px;
  flex-shrink: 0;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--label-tertiary);
  transition: transform 0.32s var(--ease-spring), color 0.2s ease, background 0.2s ease;
}

.social-arrow svg {
  width: 15px;
  height: 15px;
}

.social-card:hover .social-arrow {
  color: var(--label-primary);
  background: rgba(255, 255, 255, 0.08);
  transform: translate(2px, -2px);
}

/* ---------- MUSIC PLAYER ---------- */
.player-card {
  border-radius: var(--radius-xl);
  overflow: hidden;
  padding: 26px 28px;
  display: flex;
  flex-direction: column;
}

.player-ambient {
  position: absolute;
  inset: -48px;
  z-index: 0;
  background-size: cover;
  background-position: center;
  filter: blur(64px) saturate(0.65) brightness(0.32);
  opacity: 0.35;
  pointer-events: none;
  transition: opacity 0.5s ease;
}

.player-card.is-playing .player-ambient {
  opacity: 0.52;
}

.player-inner {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  height: 100%;
}

.player-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.player-label {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--label-tertiary);
}

.player-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 9999px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.08);
  font-size: 0.7rem;
  font-weight: 500;
  color: var(--label-secondary);
}

.player-card.is-playing .player-badge {
  color: var(--label-primary);
  background: rgba(255, 255, 255, 0.1);
}

.now-playing {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 22px;
}

.cover-box {
  position: relative;
  width: 86px;
  height: 86px;
  flex-shrink: 0;
  border-radius: 16px;
  overflow: hidden;
  background: #161618;
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.52);
  display: grid;
  place-items: center;
  transform: scale(0.95);
  transition: transform 0.5s var(--ease-spring), box-shadow 0.5s ease;
}

.player-card.is-playing .cover-box {
  transform: scale(1);
  box-shadow: 0 18px 36px rgba(0, 0, 0, 0.72);
}

.cover-fallback {
  width: 26px;
  height: 26px;
  color: rgba(255, 255, 255, 0.22);
}

.cover-box img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: opacity 0.24s ease;
}

.track-meta {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.track-title {
  margin: 0;
  font-size: 1.0625rem;
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: -0.02em;
  color: var(--label-primary);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  transition: opacity 0.18s ease, transform 0.22s var(--ease-spring);
}

.track-artist {
  font-size: 0.875rem;
  color: var(--label-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: opacity 0.18s ease, transform 0.22s var(--ease-spring);
}

.is-swapping {
  opacity: 0;
  transform: translateY(3px);
}

/* ---------- iOS 26 ELASTIC GLASS PILL SCRUBBER ---------- */
.scrubber-wrap {
  margin-bottom: 20px;
}

.seek {
  position: relative;
  height: 24px;
  display: flex;
  align-items: center;
  cursor: pointer;
  touch-action: none;
  outline: none;
}

.seek-trough {
  position: relative;
  width: 100%;
  height: 7px;
  border-radius: 9999px;
  background: rgba(255, 255, 255, 0.13);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.45);
  overflow: hidden;
  transition: height 0.26s var(--ease-spring), background 0.2s ease;
}

.seek:hover .seek-trough,
.seek.dragging .seek-trough,
.seek:focus-visible .seek-trough {
  height: 11px;
  background: rgba(255, 255, 255, 0.17);
}

.seek:focus-visible .seek-trough {
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.45), 0 0 0 3px rgba(10, 132, 255, 0.36);
}

.seek-buf {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0%;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 9999px;
}

.seek-fill {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0%;
  background: rgba(245, 245, 247, 0.9);
  border-radius: 9999px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95);
}

.seek-tip {
  position: absolute;
  top: -26px;
  left: 0;
  transform: translate(-50%, 4px);
  padding: 3px 8px;
  border-radius: 9999px;
  background: rgba(28, 28, 32, 0.92);
  border: 1px solid rgba(255, 255, 255, 0.14);
  font-size: 0.68rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--label-primary);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.14s ease, transform 0.18s var(--ease-spring);
  white-space: nowrap;
}

.seek.show-tip .seek-tip {
  opacity: 1;
  transform: translate(-50%, 0);
}

.times {
  display: flex;
  justify-content: space-between;
  margin-top: 4px;
  font-size: 0.72rem;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--label-tertiary);
}

/* ---------- TRANSPORT CONTROLS ---------- */
.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-bottom: 20px;
}

.ctrl-btn {
  position: relative;
  border: 0;
  padding: 0;
  margin: 0;
  background: transparent;
  color: var(--label-secondary);
  cursor: pointer;
  display: grid;
  place-items: center;
  border-radius: 50%;
  transition:
    transform 0.28s var(--ease-spring),
    color 0.2s ease,
    background 0.2s ease;
}

.ctrl-btn:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.38);
}

.ctrl-btn.sm {
  width: 36px;
  height: 36px;
  color: var(--label-tertiary);
}

.ctrl-btn.sm svg {
  width: 17px;
  height: 17px;
}

.ctrl-btn.md {
  width: 44px;
  height: 44px;
  color: var(--label-primary);
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
}

.ctrl-btn.md svg {
  width: 22px;
  height: 22px;
}

.ctrl-btn.sm:hover {
  color: var(--label-primary);
  background: rgba(255, 255, 255, 0.08);
}

.ctrl-btn.md:hover {
  background: rgba(255, 255, 255, 0.11);
}

.ctrl-btn.sm:active,
.ctrl-btn.md:active {
  transform: scale(0.9);
}

.ctrl-btn.sm.is-on {
  color: var(--label-primary);
  background: rgba(255, 255, 255, 0.14);
}

.ctrl-btn.play {
  width: 56px;
  height: 56px;
  background: var(--label-primary);
  color: #09090B;
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
}

.ctrl-btn.play svg {
  width: 22px;
  height: 22px;
}

.ctrl-btn.play:hover {
  background: #FFFFFF;
  transform: scale(1.04);
}

.ctrl-btn.play:active {
  transform: scale(0.93);
}

/* ---------- VOLUME ---------- */
.volume-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-bottom: 16px;
  margin-bottom: 14px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.07);
}

.vol-btn {
  width: 28px;
  height: 28px;
  border: 0;
  padding: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--label-tertiary);
  display: grid;
  place-items: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: color 0.2s ease, background 0.2s ease;
}

.vol-btn:hover {
  color: var(--label-primary);
  background: rgba(255, 255, 255, 0.06);
}

.vol-btn:focus-visible {
  outline: none;
  box-shadow: 0 0 0 2px rgba(10, 132, 255, 0.4);
}

.vol-btn svg,
.vol-static svg {
  width: 15px;
  height: 15px;
}

.vol-static {
  width: 20px;
  height: 20px;
  display: grid;
  place-items: center;
  color: var(--label-tertiary);
  flex-shrink: 0;
}

.vol-slider {
  --vol-pct: 70%;
  -webkit-appearance: none;
  appearance: none;
  flex: 1;
  height: 6px;
  border-radius: 9999px;
  background: linear-gradient(90deg, rgba(245, 245, 247, 0.85) var(--vol-pct), rgba(255, 255, 255, 0.13) var(--vol-pct));
  outline: none;
  cursor: pointer;
}

.vol-slider:focus-visible {
  box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.34);
}

.vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none;

  width: 0;
  height: 0;
}

.vol-slider::-moz-range-thumb {
  width: 0;
  height: 0;
  border: 0;
}

/* ---------- PLAYLIST ---------- */
.playlist {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.pl-item {
  width: 100%;
  border: 0;
  padding: 8px 10px;
  border-radius: 12px;
  background: transparent;
  color: var(--label-secondary);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: background 0.2s ease, color 0.2s ease, transform 0.2s var(--ease-spring);
}

.pl-item:hover {
  background: rgba(255, 255, 255, 0.055);
  color: var(--label-primary);
}

.pl-item:active {
  transform: scale(0.99);
}

.pl-item:focus-visible {
  outline: none;
  box-shadow: inset 0 0 0 2px rgba(10, 132, 255, 0.45);
}

.pl-item.active {
  background: rgba(255, 255, 255, 0.095);
  color: var(--label-primary);
}

.pl-thumb {
  position: relative;
  width: 36px;
  height: 36px;
  border-radius: 9px;
  flex-shrink: 0;
  overflow: hidden;
  background: #1A1A1D;
  border: 1px solid rgba(255, 255, 255, 0.08);
  display: grid;
  place-items: center;
}

.pl-thumb svg {
  width: 14px;
  height: 14px;
  color: rgba(255, 255, 255, 0.22);
}

.pl-thumb img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.pl-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.pl-name {
  font-size: 0.84rem;
  font-weight: 500;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.pl-item.active .pl-name {
  font-weight: 600;
}

.pl-artist {
  font-size: 0.72rem;
  color: var(--label-tertiary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.pl-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.pl-eq {
  display: none;
  align-items: flex-end;
  gap: 2px;
  height: 11px;
}

.pl-item.active .pl-eq {
  display: inline-flex;
}

.pl-eq i {
  display: block;
  width: 2px;
  height: 3px;
  border-radius: 2px;
  background: var(--label-secondary);
}

.player-card.is-playing .pl-item.active .pl-eq i {
  background: var(--label-primary);
  animation: eqBar 0.8s ease-in-out infinite alternate;
}

.player-card.is-playing .pl-item.active .pl-eq i:nth-child(2) { animation-delay: 0.25s; }
.player-card.is-playing .pl-item.active .pl-eq i:nth-child(3) { animation-delay: 0.5s; }

.pl-dur {
  font-size: 0.72rem;
  font-variant-numeric: tabular-nums;
  color: var(--label-tertiary);
  min-width: 32px;
  text-align: right;
}

/* ---------- FOOTER ---------- */

const PLAY_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8.2 5.28a1.2 1.2 0 0 1 1.85-1.01l10.22 6.72a1.2 1.2 0 0 1 0 2.02L10.05 19.73A1.2 1.2 0 0 1 8.2 18.72V5.28z"/></svg>';
const PAUSE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.5"/><rect x="13.5" y="5" width="4" height="14" rx="1.5"/></svg>';
const VOL_LOW_SVG = '<path d="M5.5 9.25H3.2A1.7 1.7 0 0 0 1.5 10.95v2.1a1.7 1.7 0 0 0 1.7 1.7h2.3l4.38 3.65a1 1 0 0 0 1.62-.78V6.38a1 1 0 0 0-1.62-.78L5.5 9.25zm9.68-.68a.9.9 0 0 0-1.27 1.27 3.1 3.1 0 0 1 0 4.32.9.9 0 1 0 1.27 1.27 4.9 4.9 0 0 0 0-6.86z"/>';
const VOL_MUTE_SVG = '<path d="M5.5 9.25H3.2A1.7 1.7 0 0 0 1.5 10.95v2.1a1.7 1.7 0 0 0 1.7 1.7h2.3l4.38 3.65a1 1 0 0 0 1.62-.78V6.38a1 1 0 0 0-1.62-.78L5.5 9.25zm10.1 1.15a.85.85 0 0 0-1.2 1.2l1.4 1.4-1.4 1.4a.85.85 0 1 0 1.2 1.2l1.4-1.4 1.4 1.4a.85.85 0 1 0 1.2-1.2l-1.4-1.4 1.4-1.4a.85.85 0 1 0-1.2-1.2l-1.4 1.4-1.4-1.4z"/>';
const NOTE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>';

let currentIdx = 0;
let shuffle = false;
let repeatOne = false;
let lastVolume = 70;
let initialized = false;
let dragging = false;

const audio = new Audio();
audio.preload = "metadata";
audio.volume = 0.7;

const $ = id => document.getElementById(id);
const playerCard = $('playerCard');
const playerAmbient = $('playerAmbient');
const coverImg = $('coverImg');
const titleEl = $('title');
const artistEl = $('artist');
const statusTxt = $('statusTxt');
const playBtn = $('playBtn');
const shuffleBtn = $('shuffleBtn');
const repeatBtn = $('repeatBtn');
const seekEl = $('seek');
const fillEl = $('fill');
const bufEl = $('buf');
const seekTip = $('seekTip');
const curEl = $('cur');
const durEl = $('dur');
const volEl = $('vol');
const muteBtn = $('muteBtn');
const volIconLow = $('volIconLow');
const plEl = $('playlist');
const dynamicPill = $('dynamicPill');
const pillImg = $('pillImg');
const pillTitle = $('pillTitle');
const pillSub = $('pillSub');

const fmt = s => {
  if (!isFinite(s) || s < 0) return "0:00";
  const m = Math.floor(s / 60);
  const r = Math.floor(s % 60);
  return m + ":" + String(r).padStart(2, "0");
};

function buildPlaylist() {
  plEl.innerHTML = "";
  playlist.forEach((t, i) => {
    const item = document.createElement("button");
    item.type = "button";
    item.className = "pl-item" + (i === currentIdx ? " active" : "");
    item.setAttribute("role", "listitem");

    const artistLine = t.artist && t.artist !== "—" ? `<span class="pl-artist">${t.artist}</span>` : "";
    item.innerHTML = `
      <span class="pl-thumb">
        ${NOTE_SVG}
        <img src="${t.portada}" alt="" loading="lazy" onerror="this.style.opacity='0'">
      </span>
      <span class="pl-info">
        <span class="pl-name">${t.titulo}</span>
        ${artistLine}
      </span>
      <span class="pl-right">
        <span class="pl-eq" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="pl-dur" data-dur="${i}"></span>
      </span>
    `;
    item.addEventListener("click", () => loadTrack(i, true));
    plEl.appendChild(item);
  });
}

function markActive() {
  [...plEl.children].forEach((el, i) => el.classList.toggle("active", i === currentIdx));
}

function syncPill(track, playing) {
  dynamicPill.classList.toggle("is-playing", !!playing);
  if (playing) {
    pillTitle.textContent = track.titulo;
    pillSub.textContent = track.artist && track.artist !== "—" ? track.artist : "Reproduciendo";
    if (pillImg.getAttribute("src") !== track.portada) {
      pillImg.style.display = "";
      pillImg.src = track.portada;
    }
  } else {
    pillTitle.textContent = "alejoows";
    pillSub.textContent = "Online · 24/7";
  }
}

function setStatus(playing) {
  playerCard.classList.toggle("is-playing", !!playing);
  statusTxt.textContent = playing ? "Reproduciendo" : "Pausado";
  playBtn.innerHTML = playing ? PAUSE_SVG : PLAY_SVG;
  playBtn.setAttribute("aria-label", playing ? "Pausar" : "Reproducir");
  syncPill(playlist[currentIdx], playing);
}

function applyTrackVisuals(track) {
  titleEl.textContent = track.titulo;
  artistEl.textContent = track.artist || "—";
  if (coverImg.getAttribute("src") === track.portada) {
    if (coverImg.complete && coverImg.naturalWidth > 0) {
      coverImg.style.opacity = "1";
    }
  } else {
    coverImg.style.opacity = "0";
    coverImg.src = track.portada;
  }
  playerAmbient.style.backgroundImage = `url('${track.portada}')`;
}

function loadTrack(idx, startPlaying = false) {
  const nextIdx = ((idx % playlist.length) + playlist.length) % playlist.length;

  if (initialized && nextIdx === currentIdx) {
    if (startPlaying && audio.paused) {
      audio.play().then(() => setStatus(true)).catch(() => setStatus(false));
    }
    return;
  }

  currentIdx = nextIdx;
  const track = playlist[currentIdx];

  audio.src = track.url;
  fillEl.style.width = "0%";
  bufEl.style.width = "0%";
  curEl.textContent = "0:00";
  durEl.textContent = "0:00";
  seekEl.setAttribute("aria-valuenow", "0");
  markActive();

  if (!initialized) {
    initialized = true;
    applyTrackVisuals(track);
    setStatus(false);
  } else {
    titleEl.classList.add("is-swapping");
    artistEl.classList.add("is-swapping");
    coverImg.style.opacity = "0";
    setTimeout(() => {
      applyTrackVisuals(track);
      titleEl.classList.remove("is-swapping");
      artistEl.classList.remove("is-swapping");
    }, 150);
    setStatus(startPlaying);
  }

  if (startPlaying) {
    setTimeout(() => {
      audio.play().catch(() => setStatus(false));
    }, 170);
  }
}

function togglePlay() {
  if (audio.paused) {
    audio.play().then(() => setStatus(true)).catch(() => setStatus(false));
  } else {
    audio.pause();
    setStatus(false);
  }
}

function pickNext(dir) {
  if (shuffle && playlist.length > 1) {
    let n;
    do {
      n = Math.floor(Math.random() * playlist.length);
    } while (n === currentIdx);
    return n;
  }
  return (currentIdx + dir + playlist.length) % playlist.length;
}

const nextTrack = () => loadTrack(pickNext(1), !audio.paused);
const prevTrack = () => {
  if (audio.currentTime > 3) {
    audio.currentTime = 0;
    return;
  }
  loadTrack(pickNext(-1), !audio.paused);
};

dynamicPill.addEventListener("click", togglePlay);
playBtn.addEventListener("click", togglePlay);
$('nextBtn').addEventListener("click", nextTrack);
$('prevBtn').addEventListener("click", prevTrack);

shuffleBtn.addEventListener("click", () => {
  shuffle = !shuffle;
  shuffleBtn.classList.toggle("is-on", shuffle);
  shuffleBtn.setAttribute("aria-pressed", String(shuffle));
});

repeatBtn.addEventListener("click", () => {
  repeatOne = !repeatOne;
  repeatBtn.classList.toggle("is-on", repeatOne);
  repeatBtn.setAttribute("aria-pressed", String(repeatOne));
});

audio.addEventListener("ended", () => {
  if (repeatOne) {
    audio.currentTime = 0;
    audio.play().catch(() => setStatus(false));
  } else {
    loadTrack(pickNext(1), true);
  }
});

audio.addEventListener("play", () => setStatus(true));
audio.addEventListener("pause", () => setStatus(false));

audio.addEventListener("loadedmetadata", () => {
  const formatted = fmt(audio.duration);
  durEl.textContent = formatted;
  const d = plEl.querySelector(`[data-dur="${currentIdx}"]`);
  if (d) d.textContent = formatted;
});

audio.addEventListener("timeupdate", () => {
  const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  fillEl.style.width = pct + "%";
  curEl.textContent = fmt(audio.currentTime);
  seekEl.setAttribute("aria-valuenow", String(Math.round(pct)));
});

audio.addEventListener("progress", () => {
  try {
    if (audio.buffered.length && audio.duration) {
      const pct = (audio.buffered.end(audio.buffered.length - 1) / audio.duration) * 100;
      bufEl.style.width = pct + "%";
    }
  } catch (_) {}
});

function getRatio(clientX) {
  const rect = seekEl.getBoundingClientRect();
  return rect.width ? Math.min(1, Math.max(0, (clientX - rect.left) / rect.width)) : 0;
}

function updateTip(ratio) {
  if (!isFinite(audio.duration) || audio.duration <= 0) {
    seekEl.classList.remove("show-tip");
    return;
  }
  const rect = seekEl.getBoundingClientRect();
  const px = Math.min(rect.width - 18, Math.max(18, ratio * rect.width));
  seekTip.style.left = px + "px";
  seekTip.textContent = fmt(ratio * audio.duration);
  seekEl.classList.add("show-tip");
}

function seekToRatio(ratio) {
  if (audio.duration) {
    audio.currentTime = ratio * audio.duration;
  }
  fillEl.style.width = ratio * 100 + "%";
}

seekEl.addEventListener("pointerdown", e => {
  dragging = true;
  seekEl.classList.add("dragging");
  seekEl.setPointerCapture(e.pointerId);
  const r = getRatio(e.clientX);
  updateTip(r);
  seekToRatio(r);
});

seekEl.addEventListener("pointermove", e => {
  const r = getRatio(e.clientX);
  updateTip(r);
  if (dragging) seekToRatio(r);
});

seekEl.addEventListener("pointerleave", () => {
  if (!dragging) seekEl.classList.remove("show-tip");
});

seekEl.addEventListener("pointerup", () => {
  dragging = false;
  seekEl.classList.remove("dragging", "show-tip");
});

seekEl.addEventListener("pointercancel", () => {
  dragging = false;
  seekEl.classList.remove("dragging", "show-tip");
});

seekEl.addEventListener("keydown", e => {
  if (!audio.duration) return;
  if (e.key === "ArrowRight") {
    audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
    e.preventDefault();
  } else if (e.key === "ArrowLeft") {
    audio.currentTime = Math.max(0, audio.currentTime - 5);
    e.preventDefault();
  } else if (e.key === " " || e.key === "Enter") {
    togglePlay();
    e.preventDefault();
  }
});

document.addEventListener("keydown", e => {
  const tag = e.target && e.target.tagName;
  if (tag === "INPUT" || tag === "BUTTON" || tag === "A") return;
  if (e.code === "Space" && e.target !== seekEl) {
    togglePlay();
    e.preventDefault();
  } else if (e.code === "ArrowRight" && e.shiftKey) {
    nextTrack();
  } else if (e.code === "ArrowLeft" && e.shiftKey) {
    prevTrack();
  }
});

function updateVolumeUI(val) {
  const numeric = Number(val);
  audio.volume = numeric / 100;
  volEl.value = String(numeric);
  volEl.style.setProperty("--vol-pct", numeric + "%");
  volIconLow.innerHTML = numeric === 0 ? VOL_MUTE_SVG : VOL_LOW_SVG;
  muteBtn.setAttribute("aria-label", numeric === 0 ? "Activar audio" : "Silenciar");
}

volEl.addEventListener("input", () => {
  const v = Number(volEl.value);
  if (v > 0) lastVolume = v;
  updateVolumeUI(v);
});

muteBtn.addEventListener("click", () => {
  if (Number(volEl.value) === 0) {
    updateVolumeUI(lastVolume || 70);
  } else {
    lastVolume = Number(volEl.value);
    updateVolumeUI(0);
  }
});

updateVolumeUI(70);
buildPlaylist();
loadTrack(0, false);
</script>
</body>
</html>
