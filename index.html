<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>alejoows</title>
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="description" content="alejoows — Redes sociales y música.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   ALEJOOWS — APPLE DARK MINIMALIST EDITION
   ============================================================ */
:root {
  --bg-canvas: #000000;
  --surface-1: rgba(22, 22, 24, 0.74);
  --surface-2: rgba(28, 28, 31, 0.68);
  --surface-hover: rgba(40, 40, 44, 0.84);
  --border-hairline: rgba(255, 255, 255, 0.085);
  --border-hover: rgba(255, 255, 255, 0.17);
  --specular-top: rgba(255, 255, 255, 0.075);

  --label-primary: #F5F5F7;
  --label-secondary: rgba(235, 235, 245, 0.60);
  --label-tertiary: rgba(235, 235, 245, 0.36);

  --accent-blue: #0A84FF;
  --accent-green: #30D158;

  --radius-xl: 28px;
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;

  --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

*, *::before, *::after {
  box-sizing: border-box;
}

html {
  height: 100%;
  background: var(--bg-canvas);
  color-scheme: dark;
}

body {
  margin: 0;
  min-height: 100dvh;
  padding: clamp(28px, 6vh, 64px) clamp(16px, 4vw, 32px) clamp(24px, 4vh, 40px);
  background: var(--bg-canvas);
  color: var(--label-primary);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

img, svg {
  display: block;
}

::selection {
  background: rgba(10, 132, 255, 0.35);
  color: #FFFFFF;
}

/* ---------- AMBIENT CANVAS LIGHTING ---------- */
.ambient-canvas {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(75% 50% at 50% -10%, rgba(120, 135, 170, 0.085), transparent 72%),
    radial-gradient(45% 40% at 85% 95%, rgba(65, 85, 130, 0.055), transparent 70%),
    radial-gradient(40% 35% at 10% 85%, rgba(90, 95, 115, 0.045), transparent 70%);
}

/* ---------- MAIN STAGE ---------- */
.stage {
  width: 100%;
  max-width: 896px;
  margin-top: auto;
  margin-bottom: auto;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

.bento-grid {
  display: grid;
  grid-template-columns: minmax(320px, 376px) minmax(0, 1fr);
  gap: 24px;
  align-items: stretch;
}

.col-left {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* ---------- GLASS MATERIAL ---------- */
.glass-panel {
  position: relative;
  background: linear-gradient(180deg, rgba(28, 28, 31, 0.72) 0%, rgba(19, 19, 22, 0.84) 100%);
  border: 1px solid var(--border-hairline);
  border-radius: var(--radius-xl);
  box-shadow:
    inset 0 1px 0 0 var(--specular-top),
    0 24px 60px -18px rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(28px) saturate(160%);
  -webkit-backdrop-filter: blur(28px) saturate(160%);
}

/* ---------- ENTRANCE ANIMATION ---------- */
.reveal {
  animation: surfaceIn 0.7s var(--ease-spring) both;
}
.reveal-1 { animation-delay: 0.04s; }
.reveal-2 { animation-delay: 0.11s; }
.reveal-3 { animation-delay: 0.18s; }
.reveal-4 { animation-delay: 0.25s; }

@keyframes surfaceIn {
  from {
    opacity: 0;
    transform: translateY(14px) scale(0.99);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* ---------- PROFILE CARD ---------- */
.profile-card {
  flex: 1;
  padding: 36px 28px 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.avatar-wrap {
  position: relative;
  width: 92px;
  height: 92px;
  border-radius: 50%;
  margin-bottom: 18px;
}

.avatar-halo {
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.11), transparent 70%);
  filter: blur(12px);
  pointer-events: none;
}

.avatar-circle {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  background: linear-gradient(145deg, #242428, #141416);
  border: 1px solid rgba(255, 255, 255, 0.14);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.16),
    0 12px 30px rgba(0, 0, 0, 0.65);
  display: grid;
  place-items: center;
}

.avatar-fallback {
  font-size: 2rem;
  font-weight: 600;
  letter-spacing: -0.04em;
  color: rgba(245, 245, 247, 0.45);
  user-select: none;
}

.avatar-circle img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: opacity 0.3s ease;
}

.profile-name {
  margin: 0;
  font-size: 1.75rem;
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -0.03em;
  color: var(--label-primary);
}

.profile-handle {
  margin-top: 4px;
  font-size: 0.875rem;
  font-weight: 400;
  letter-spacing: -0.005em;
  color: var(--label-secondary);
}

.status-pill {
  margin-top: 16px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 13px;
  border-radius: 9999px;
  background: rgba(255, 255, 255, 0.045);
  border: 1px solid rgba(255, 255, 255, 0.075);
  font-size: 0.75rem;
  font-weight: 500;
  letter-spacing: 0.01em;
  color: rgba(245, 245, 247, 0.84);
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent-green);
  box-shadow: 0 0 10px rgba(48, 209, 88, 0.65);
  animation: breathe 3s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% {
    opacity: 1;
    transform: scale(1);
    box-shadow: 0 0 8px rgba(48, 209, 88, 0.55);
  }
  50% {
    opacity: 0.65;
    transform: scale(0.92);
    box-shadow: 0 0 14px rgba(48, 209, 88, 0.85);
  }
}

/* ---------- SOCIAL SECTION ---------- */
.socials-section {
  display: flex;
  flex-direction: column;
}

.section-label {
  margin: 0 0 10px 6px;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--label-tertiary);
}

.links-stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.social-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 15px 18px;
  text-decoration: none;
  color: var(--label-primary);
  background: var(--surface-2);
  border: 1px solid var(--border-hairline);
  border-radius: var(--radius-lg);
  box-shadow:
    inset 0 1px 0 0 rgba(255, 255, 255, 0.055),
    0 12px 30px -14px rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(22px) saturate(150%);
  -webkit-backdrop-filter: blur(22px) saturate(150%);
  transition:
    transform 0.38s var(--ease-spring),
    background 0.28s ease,
    border-color 0.28s ease,
    box-shadow 0.38s var(--ease-spring);
}

.social-card:hover {
  transform: translateY(-2px);
  background: var(--surface-hover);
  border-color: var(--border-hover);
  box-shadow:
    inset 0 1px 0 0 rgba(255, 255, 255, 0.1),
    0 18px 36px -14px rgba(0, 0, 0, 0.9);
}

.social-card:active {
  transform: scale(0.985);
  transition-duration: 0.12s;
}

.social-card:focus-visible {
  outline: none;
  border-color: rgba(10, 132, 255, 0.7);
  box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.32);
}

.social-icon {
  width: 46px;
  height: 46px;
  flex-shrink: 0;
  border-radius: 13px;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, 0.055);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: var(--label-primary);
  transition:
    transform 0.38s var(--ease-spring),
    background 0.28s ease,
    border-color 0.28s ease,
    box-shadow 0.35s ease;
}

.social-icon svg {
  width: 21px;
  height: 21px;
}

.social-card:hover .social-icon {
  transform: scale(1.04);
}

.social-card[data-brand="tiktok"]:hover .social-icon {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.2);
  box-shadow: 0 0 22px rgba(110, 235, 255, 0.14), 0 0 22px rgba(255, 65, 115, 0.12);
}

.social-card[data-brand="instagram"]:hover .social-icon {
  background: linear-gradient(135deg, rgba(255, 115, 85, 0.2), rgba(214, 41, 118, 0.2));
  border-color: rgba(255, 130, 160, 0.28);
  box-shadow: 0 0 22px rgba(225, 65, 135, 0.18);
}

.social-card[data-brand="roblox"]:hover .social-icon {
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.22);
  box-shadow: 0 0 22px rgba(255, 255, 255, 0.12);
}

.social-meta {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.social-title {
  font-size: 0.9375rem;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--label-primary);
}

.social-sub {
  font-size: 0.8125rem;
  font-weight: 400;
  color: var(--label-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.social-arrow {
  width: 28px;
  height: 28px;
  flex-shrink: 0;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--label-tertiary);
  transition:
    transform 0.35s var(--ease-spring),
    color 0.25s ease,
    background 0.25s ease;
}

.social-arrow svg {
  width: 15px;
  height: 15px;
}

.social-card:hover .social-arrow {
  color: var(--label-primary);
  background: rgba(255, 255, 255, 0.08);
  transform: translate(2px, -2px);
}

/* ---------- MUSIC PLAYER CARD ---------- */
.player-card {
  overflow: hidden;
  padding: 28px;
  display: flex;
  flex-direction: column;
}

.player-ambient {
  position: absolute;
  inset: -48px;
  z-index: 0;
  background-size: cover;
  background-position: center;
  filter: blur(68px) saturate(1.45) brightness(0.42);
  opacity: 0.16;
  pointer-events: none;
  transition: opacity 0.65s ease;
}

.player-card.is-playing .player-ambient {
  opacity: 0.28;
}

.player-inner {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  height: 100%;
}

.player-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
}

.player-head-label {
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--label-tertiary);
}

.player-state-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 9999px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.07);
  font-size: 0.7rem;
  font-weight: 500;
  color: var(--label-secondary);
  transition: color 0.25s ease, border-color 0.25s ease, background 0.25s ease;
}

.player-card.is-playing .player-state-pill {
  color: var(--label-primary);
  background: rgba(255, 255, 255, 0.085);
  border-color: rgba(255, 255, 255, 0.13);
}

.mini-bars {
  display: inline-flex;
  align-items: flex-end;
  gap: 2px;
  height: 10px;
}

.mini-bars i {
  display: block;
  width: 2px;
  height: 3px;
  border-radius: 2px;
  background: var(--label-tertiary);
  transition: background 0.25s ease, height 0.25s ease;
}

.player-card.is-playing .mini-bars i {
  background: var(--label-primary);
  animation: eqPulse 0.9s ease-in-out infinite alternate;
}

.player-card.is-playing .mini-bars i:nth-child(1) { animation-delay: 0s; }
.player-card.is-playing .mini-bars i:nth-child(2) { animation-delay: 0.25s; }
.player-card.is-playing .mini-bars i:nth-child(3) { animation-delay: 0.5s; }

@keyframes eqPulse {
  0% { height: 3px; }
  100% { height: 10px; }
}

/* Now Playing row */
.now-playing {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 24px;
}

.cover-stage {
  position: relative;
  width: 88px;
  height: 88px;
  flex-shrink: 0;
}

.cover-glow {
  position: absolute;
  inset: 8px 4px -6px;
  border-radius: 16px;
  background-size: cover;
  background-position: center;
  filter: blur(18px) saturate(1.3);
  opacity: 0.22;
  transition: opacity 0.55s ease, transform 0.55s var(--ease-spring);
  pointer-events: none;
}

.player-card.is-playing .cover-glow {
  opacity: 0.52;
  transform: scale(1.04);
}

.cover-frame {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 16px;
  overflow: hidden;
  background: linear-gradient(145deg, #222226, #131316);
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.52);
  display: grid;
  place-items: center;
  transform: scale(0.94);
  transition:
    transform 0.55s var(--ease-spring),
    box-shadow 0.55s ease;
}

.player-card.is-playing .cover-frame {
  transform: scale(1);
  box-shadow: 0 18px 38px rgba(0, 0, 0, 0.7);
}

.cover-fallback {
  width: 28px;
  height: 28px;
  color: rgba(255, 255, 255, 0.24);
}

.cover-frame img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: opacity 0.24s ease;
}

.track-meta {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.track-title {
  margin: 0;
  font-size: 1.0625rem;
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: -0.02em;
  color: var(--label-primary);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  transition: opacity 0.2s ease, transform 0.25s var(--ease-spring);
}

.track-artist {
  font-size: 0.875rem;
  font-weight: 400;
  color: var(--label-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: opacity 0.2s ease, transform 0.25s var(--ease-spring);
}

.is-swapping {
  opacity: 0;
  transform: translateY(3px);
}

/* Scrubber */
.scrubber-wrap {
  margin-bottom: 20px;
}

.seek {
  position: relative;
  height: 20px;
  display: flex;
  align-items: center;
  cursor: pointer;
  touch-action: none;
  outline: none;
}

.seek-rail {
  position: relative;
  width: 100%;
  height: 4px;
  border-radius: 9999px;
  background: rgba(255, 255, 255, 0.13);
  overflow: hidden;
  transition: height 0.2s var(--ease-spring), background 0.2s ease;
}

.seek:hover .seek-rail,
.seek.dragging .seek-rail,
.seek:focus-visible .seek-rail {
  height: 6px;
  background: rgba(255, 255, 255, 0.17);
}

.seek:focus-visible .seek-rail {
  box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.32);
}

.seek-buf {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0%;
  background: rgba(255, 255, 255, 0.14);
  border-radius: 9999px;
}

.seek-fill {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0%;
  background: rgba(245, 245, 247, 0.92);
  border-radius: 9999px;
}

.seek-thumb {
  position: absolute;
  top: 50%;
  left: 0%;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #FFFFFF;
  box-shadow: 0 1px 6px rgba(0, 0, 0, 0.65);
  opacity: 0;
  transform: translate(-50%, -50%) scale(0.55);
  transition: opacity 0.18s ease, transform 0.22s var(--ease-spring);
  pointer-events: none;
}

.seek:hover .seek-thumb,
.seek.dragging .seek-thumb,
.seek:focus-visible .seek-thumb {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

.times {
  display: flex;
  justify-content: space-between;
  margin-top: 4px;
  font-size: 0.72rem;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--label-tertiary);
}

/* Transport controls */
.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin-bottom: 20px;
}

.ctrl-btn {
  position: relative;
  border: 0;
  padding: 0;
  margin: 0;
  background: transparent;
  color: var(--label-secondary);
  cursor: pointer;
  display: grid;
  place-items: center;
  border-radius: 50%;
  transition:
    transform 0.28s var(--ease-spring),
    color 0.2s ease,
    background 0.2s ease,
    box-shadow 0.25s ease;
}

.ctrl-btn:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.38);
}

.ctrl-btn.sm {
  width: 36px;
  height: 36px;
  color: var(--label-tertiary);
}

.ctrl-btn.sm svg {
  width: 16px;
  height: 16px;
}

.ctrl-btn.md {
  width: 44px;
  height: 44px;
  color: var(--label-primary);
}

.ctrl-btn.md svg {
  width: 22px;
  height: 22px;
}

.ctrl-btn.sm:hover,
.ctrl-btn.md:hover {
  color: var(--label-primary);
  background: rgba(255, 255, 255, 0.08);
}

.ctrl-btn.sm:active,
.ctrl-btn.md:active {
  transform: scale(0.9);
}

.ctrl-btn.sm.is-on {
  color: var(--accent-blue);
  background: rgba(10, 132, 255, 0.12);
}

.ctrl-btn.sm.is-on::after {
  content: '';
  position: absolute;
  bottom: 3px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent-blue);
}

.ctrl-btn.play {
  width: 54px;
  height: 54px;
  background: var(--label-primary);
  color: #09090B;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.42);
}

.ctrl-btn.play svg {
  width: 22px;
  height: 22px;
}

.ctrl-btn.play:hover {
  background: #FFFFFF;
  transform: scale(1.05);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.55);
}

.ctrl-btn.play:active {
  transform: scale(0.94);
}

/* Volume */
.volume-row {
  display: flex;
  align-items: center;
  gap: 11px;
  padding-bottom: 18px;
  margin-bottom: 14px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.065);
}

.vol-icon-btn {
  width: 28px;
  height: 28px;
  border: 0;
  padding: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--label-tertiary);
  display: grid;
  place-items: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: color 0.2s ease, background 0.2s ease;
}

.vol-icon-btn:hover {
  color: var(--label-secondary);
  background: rgba(255, 255, 255, 0.06);
}

.vol-icon-btn:focus-visible {
  outline: none;
  box-shadow: 0 0 0 2px rgba(10, 132, 255, 0.4);
}

.vol-icon-btn svg {
  width: 15px;
  height: 15px;
}

.vol-static {
  width: 20px;
  height: 20px;
  display: grid;
  place-items: center;
  color: var(--label-tertiary);
  flex-shrink: 0;
}

.vol-static svg {
  width: 15px;
  height: 15px;
}

.vol-slider {
  --vol-pct: 70%;
  -webkit-appearance: none;
  appearance: none;
  flex: 1;
  height: 4px;
  border-radius: 9999px;
  background: linear-gradient(90deg, rgba(245, 245, 247, 0.78) var(--vol-pct), rgba(255, 255, 255, 0.13) var(--vol-pct));
  outline: none;
  cursor: pointer;
}

.vol-slider:focus-visible {

}

  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #FFFFFF;
  box-shadow: 0 1px 5px rgba(0, 0, 0, 0.6);

  transition: transform 0.2s var(--ease-spring);
}

.vol-slider:hover::-webkit-slider-thumb {

}

.vol-slider::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border: 0;
  border-radius: 50%;
  background: #FFFFFF;
  box-shadow: 0 1px 5px rgba(0, 0, 0, 0.6);
  cursor: pointer;
}

/* Playlist */
.playlist {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.pl-item {
  width: 100%;
  border: 0;
  padding: 8px 10px;
  border-radius: 12px;
  background: transparent;
  color: var(--label-secondary);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;

    background 0.22s ease,
    color 0.22s ease,
    transform 0.2s var(--ease-spring);
}

.pl-item:hover {
  background: rgba(255, 255, 255, 0.055);
  color: var(--label-primary);
}

.pl-item:active {
  transform: scale(0.99);
}

.pl-item:focus-visible {
  outline: none;
  box-shadow: inset 0 0 0 2px rgba(10, 132, 255, 0.45);
}

.pl-item.active {
  background: rgba(255, 255, 255, 0.09);
  color: var(--label-primary);
}

.pl-thumb {
  position: relative;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  flex-shrink: 0;
  overflow: hidden;
  background: linear-gradient(145deg, #242428, #141416);
  border: 1px solid rgba(255, 255, 255, 0.08);
  display: grid;
  place-items: center;
}

.pl-thumb svg {
  width: 14px;
  height: 14px;
  color: rgba(255, 255, 255, 0.24);
}

.pl-thumb img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.pl-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.pl-name {
  font-size: 0.84rem;
  font-weight: 500;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.pl-item.active .pl-name {
  font-weight: 600;
}

.pl-artist {
  font-size: 0.73rem;
  color: var(--label-tertiary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.pl-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.pl-eq {
  display: none;
  align-items: flex-end;
  gap: 2px;
  height: 11px;
}

.pl-item.active .pl-eq {
  display: inline-flex;
}

.pl-eq i {
  display: block;
  width: 2px;
  height: 3px;
  border-radius: 2px;
  background: var(--label-secondary);
}

.player-card.is-playing .pl-item.active .pl-eq i {

}

.player-card.is-playing .pl-item.active .pl-eq i:nth-child(2) {
  animation-delay: 0.28s;
}

.player-card.is-playing .pl-item.active .pl-eq i:nth-child(3) {

}

.pl-dur {

/* ---------- FOOTER ---------- */

<script>
const playlist = [
  {
    titulo: "Runaway",
    artist: "Kanye West",
    url: "https://files.catbox.moe/47n050.mp3",
    portada: "https://i.postimg.cc/JzZ40pr9/ad26202c265fccc74e5a5b4a754d7190.jpg"
  },
  {
    titulo: "Leni (Crystal Castles vs GoodBooks)",
    artist: "Crystal Castles",
    url: "https://files.catbox.moe/1kldwc.mp3",
    portada: "https://i.postimg.cc/cJTWtjV9/7ab9e7f9ce15395e67d24d6721c8c97a.jpg"
  },
  {
    titulo: "4 Morant",
    artist: "—",
    url: "https://files.catbox.moe/vs9wbu.mp3",
    portada: "https://i.postimg.cc/prjXjCQh/66cb84ed609c98fb54228174c482a4fe.jpg"
  },
  {
    titulo: "Oblivion",
    artist: "Grimes",
    url: "https://files.catbox.moe/f5g1qa.mp3",
    portada: "https://i.postimg.cc/Y9GpcRPM/fba5d91ad47954e008ac2cbfac6eb43d.jpg"
  }
];

const PLAY_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.14v13.72a1 1 0 0 0 1.54.84l10.62-6.86a1 1 0 0 0 0-1.68L9.54 4.3A1 1 0 0 0 8 5.14z"/></svg>';
const PAUSE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.4"/><rect x="13.5" y="5" width="4" height="14" rx="1.4"/></svg>';
const VOL_LOW_SVG = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>';
const VOL_MUTE_SVG = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/>';
const NOTE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>';

let currentIdx = 0;
let shuffle = false;
let repeatOne = false;
let lastVolume = 70;
let initialized = false;

const audio = new Audio();
audio.preload = "metadata";
audio.volume = 0.7;

const $ = id => document.getElementById(id);
const playerCard = $('playerCard');
const playerAmbient = $('playerAmbient');
const coverGlow = $('coverGlow');
const coverImg = $('coverImg');
const titleEl = $('title');
const artistEl = $('artist');
const statusTxt = $('statusTxt');
const playBtn = $('playBtn');
const shuffleBtn = $('shuffleBtn');
const repeatBtn = $('repeatBtn');
const seekEl = $('seek');
const fillEl = $('fill');
const bufEl = $('buf');
const knobEl = $('knob');
const curEl = $('cur');
const durEl = $('dur');
const volEl = $('vol');
const muteBtn = $('muteBtn');
const volIconLow = $('volIconLow');
const plEl = $('playlist');

const fmt = s => {
  if (!isFinite(s) || s < 0) return "0:00";
  const m = Math.floor(s / 60);
  const r = Math.floor(s % 60);
  return m + ":" + String(r).padStart(2, "0");
};

function buildPlaylist() {
  plEl.innerHTML = "";
  playlist.forEach((t, i) => {
    const item = document.createElement("button");
    item.type = "button";
    item.className = "pl-item" + (i === currentIdx ? " active" : "");
    item.setAttribute("role", "listitem");

    const artistLine = t.artist && t.artist !== "—" ? `<span class="pl-artist">${t.artist}</span>` : "";
    item.innerHTML = `
      <span class="pl-thumb">
        ${NOTE_SVG}
        <img src="${t.portada}" alt="" loading="lazy" onerror="this.style.opacity='0'">
      </span>
      <span class="pl-info">
        <span class="pl-name">${t.titulo}</span>
        ${artistLine}
      </span>
      <span class="pl-right">
        <span class="pl-eq" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="pl-dur" data-dur="${i}"></span>
      </span>
    `;
    item.addEventListener("click", () => loadTrack(i, true));
    plEl.appendChild(item);
  });
}

function markActive() {
  [...plEl.children].forEach((el, i) => el.classList.toggle("active", i === currentIdx));
}

function setStatus(playing) {
  playerCard.classList.toggle("is-playing", !!playing);
  statusTxt.textContent = playing ? "Reproduciendo" : "Pausado";
  playBtn.innerHTML = playing ? PAUSE_SVG : PLAY_SVG;
  playBtn.setAttribute("aria-label", playing ? "Pausar" : "Reproducir");
}

function applyTrackVisuals(track) {
  titleEl.textContent = track.titulo;
  artistEl.textContent = track.artist || "—";
  if (coverImg.getAttribute("src") === track.portada) {
    if (coverImg.complete && coverImg.naturalWidth > 0) {
      coverImg.style.opacity = "1";
    }
  } else {
    coverImg.style.opacity = "0";
    coverImg.src = track.portada;
  }
  const bg = `url('${track.portada}')`;
  playerAmbient.style.backgroundImage = bg;
  coverGlow.style.backgroundImage = bg;
}

function loadTrack(idx, startPlaying = false) {
  const nextIdx = ((idx % playlist.length) + playlist.length) % playlist.length;

  if (initialized && nextIdx === currentIdx) {
    if (startPlaying && audio.paused) {
      audio.play().then(() => setStatus(true)).catch(() => setStatus(false));
    }
    return;
  }

  currentIdx = nextIdx;
  const track = playlist[currentIdx];

  audio.src = track.url;
  fillEl.style.width = "0%";
  knobEl.style.left = "0%";
  bufEl.style.width = "0%";
  curEl.textContent = "0:00";
  durEl.textContent = "0:00";
  seekEl.setAttribute("aria-valuenow", "0");
  markActive();

  if (!initialized) {
    initialized = true;
    applyTrackVisuals(track);
    setStatus(false);
  } else {
    titleEl.classList.add("is-swapping");
    artistEl.classList.add("is-swapping");
    coverImg.style.opacity = "0";
    setTimeout(() => {
      applyTrackVisuals(track);
      titleEl.classList.remove("is-swapping");
      artistEl.classList.remove("is-swapping");
    }, 160);
    setStatus(startPlaying);
  }

  if (startPlaying) {
    setTimeout(() => {
      audio.play().catch(() => setStatus(false));
    }, 180);
  }
}

function togglePlay() {
  if (audio.paused) {
    audio.play().then(() => setStatus(true)).catch(() => setStatus(false));
  } else {
    audio.pause();
    setStatus(false);
  }
}

function pickNext(dir) {
  if (shuffle && playlist.length > 1) {
    let n;
    do {
      n = Math.floor(Math.random() * playlist.length);
    } while (n === currentIdx);
    return n;
  }
  return (currentIdx + dir + playlist.length) % playlist.length;
}

const nextTrack = () => loadTrack(pickNext(1), !audio.paused);
const prevTrack = () => {
  if (audio.currentTime > 3) {
    audio.currentTime = 0;
    return;
  }
  loadTrack(pickNext(-1), !audio.paused);
};

playBtn.addEventListener("click", togglePlay);
$('nextBtn').addEventListener("click", nextTrack);
$('prevBtn').addEventListener("click", prevTrack);

shuffleBtn.addEventListener("click", () => {
  shuffle = !shuffle;
  shuffleBtn.classList.toggle("is-on", shuffle);
  shuffleBtn.setAttribute("aria-pressed", String(shuffle));
});

repeatBtn.addEventListener("click", () => {
  repeatOne = !repeatOne;
  repeatBtn.classList.toggle("is-on", repeatOne);
  repeatBtn.setAttribute("aria-pressed", String(repeatOne));
});

audio.addEventListener("ended", () => {
  if (repeatOne) {
    audio.currentTime = 0;
    audio.play().catch(() => setStatus(false));
  } else {
    loadTrack(pickNext(1), true);
  }
});

audio.addEventListener("play", () => setStatus(true));
audio.addEventListener("pause", () => setStatus(false));

audio.addEventListener("loadedmetadata", () => {
  const formatted = fmt(audio.duration);
  durEl.textContent = formatted;
  const d = plEl.querySelector(`[data-dur="${currentIdx}"]`);
  if (d) d.textContent = formatted;
});

audio.addEventListener("timeupdate", () => {
  const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  fillEl.style.width = pct + "%";
  knobEl.style.left = pct + "%";
  curEl.textContent = fmt(audio.currentTime);
  seekEl.setAttribute("aria-valuenow", String(Math.round(pct)));
});

audio.addEventListener("progress", () => {
  try {
    if (audio.buffered.length && audio.duration) {
      const pct = (audio.buffered.end(audio.buffered.length - 1) / audio.duration) * 100;
      bufEl.style.width = pct + "%";
    }
  } catch (_) {}
});

function seekFromClientX(clientX) {
  const rect = seekEl.getBoundingClientRect();
  const ratio = rect.width ? Math.min(1, Math.max(0, (clientX - rect.left) / rect.width)) : 0;
  if (audio.duration) {
    audio.currentTime = ratio * audio.duration;
  }
  const pct = ratio * 100 + "%";
  fillEl.style.width = pct;
  knobEl.style.left = pct;
}

let dragging = false;
seekEl.addEventListener("pointerdown", e => {
  dragging = true;
  seekEl.classList.add("dragging");
  seekEl.setPointerCapture(e.pointerId);
  seekFromClientX(e.clientX);
});
seekEl.addEventListener("pointermove", e => {
  if (dragging) seekFromClientX(e.clientX);
});
seekEl.addEventListener("pointerup", () => {
  dragging = false;
  seekEl.classList.remove("dragging");
});
seekEl.addEventListener("pointercancel", () => {
  dragging = false;
  seekEl.classList.remove("dragging");
});

seekEl.addEventListener("keydown", e => {
  if (!audio.duration) return;
  if (e.key === "ArrowRight") {
    audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
    e.preventDefault();
  } else if (e.key === "ArrowLeft") {
    audio.currentTime = Math.max(0, audio.currentTime - 5);
    e.preventDefault();
  } else if (e.key === " " || e.key === "Enter") {
    togglePlay();
    e.preventDefault();
  }
});

document.addEventListener("keydown", e => {
  const tag = e.target && e.target.tagName;
  if (tag === "INPUT" || tag === "BUTTON" || tag === "A") return;
  if (e.code === "Space" && e.target !== seekEl) {
    togglePlay();
    e.preventDefault();
  } else if (e.code === "ArrowRight" && e.shiftKey) {
    nextTrack();
  } else if (e.code === "ArrowLeft" && e.shiftKey) {
    prevTrack();
  }
});

function updateVolumeUI(val) {
  const numeric = Number(val);
  audio.volume = numeric / 100;
  volEl.value = String(numeric);
  volEl.style.setProperty("--vol-pct", numeric + "%");
  volIconLow.innerHTML = numeric === 0 ? VOL_MUTE_SVG : VOL_LOW_SVG;
  muteBtn.setAttribute("aria-label", numeric === 0 ? "Activar audio" : "Silenciar");
}

volEl.addEventListener("input", () => {
  const v = Number(volEl.value);
  if (v > 0) lastVolume = v;
  updateVolumeUI(v);
});

muteBtn.addEventListener("click", () => {
  if (Number(volEl.value) === 0) {
    updateVolumeUI(lastVolume || 70);
  } else {
    lastVolume = Number(volEl.value);
    updateVolumeUI(0);
  }
});

updateVolumeUI(70);
buildPlaylist();
loadTrack(0, false);
</script>
</body>
</html>
